<!DOCTYPE html>
<html lang="fr">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>English - Le Monde des Curieux</title>
        <link rel="stylesheet" href="styles/english_BON_CSS.css">
    </head>

    <body x-data="englishApp" x-cloak>

        <!-- Système XP -->
        <script src="scripts/section-xp-system.js"></script>
        <script src="scripts/badges-system.js"></script>
        <script src="scripts/storage-bridge.js"></script>

        <!-- Bulle Curio -->
        <div x-data="curioBubble" x-show="visible" x-transition :class="'curio-bubble ' + variant">
            <button @click="hide()" class="curio-close">×</button>
            <div class="curio-avatar">🦊</div>
            <p class="curio-message" x-text="currentMessage"></p>
        </div>

        <div class="english-container">
            <!-- Header avec bouton retour -->
            <div class="section-header">
                <button onclick="window.location.href='index.html'" class="back-btn">
                    ← Retour à l'accueil
                </button>
            </div>

            <!-- Titre section -->
            <div class="section-title">
                <h1>🇬🇧 Learn English!</h1>
                <p>Discover English through fun and interactive activities!</p>
            </div>

            <!-- Navigation thèmes -->
            <div class="themes-nav">
                <button @click="selectTheme('vocabulary')"
                    :class="'theme-btn vocabulary' + (currentTheme === 'vocabulary' ? ' active' : '')">
                    📚 Basic Vocabulary
                </button>
                <button @click="selectTheme('phrases')"
                    :class="'theme-btn phrases' + (currentTheme === 'phrases' ? ' active' : '')">
                    💬 Everyday Phrases
                </button>
                <button @click="selectTheme('grammar')"
                    :class="'theme-btn grammar' + (currentTheme === 'grammar' ? ' active' : '')">
                    📖 Grammar Basics
                </button>
                <button @click="selectTheme('numbers')"
                    :class="'theme-btn numbers' + (currentTheme === 'numbers' ? ' active' : '')">
                    🔢 Numbers & Time
                </button>
                <button @click="selectTheme('school')"
                    :class="'theme-btn school' + (currentTheme === 'school' ? ' active' : '')">
                    🏫 At School
                </button>
                <button @click="selectTheme('body')"
                    :class="'theme-btn body' + (currentTheme === 'body' ? ' active' : '')">
                    🧍 My Body & Health
                </button>
                <button @click="selectTheme('home')"
                    :class="'theme-btn home' + (currentTheme === 'home' ? ' active' : '')">
                    🏠 At Home
                </button>
                <button @click="selectTheme('hobbies')"
                    :class="'theme-btn hobbies' + (currentTheme === 'hobbies' ? ' active' : '')">
                    ⚽ Hobbies & Sports
                </button>
                <button @click="selectTheme('food')"
                    :class="'theme-btn food' + (currentTheme === 'food' ? ' active' : '')">
                    🍽️ Food & Meals
                </button>
                <button @click="selectTheme('weather')"
                    :class="'theme-btn weather' + (currentTheme === 'weather' ? ' active' : '')">
                    ☀️ Weather & Seasons
                </button>
            </div>

            <!-- Contenu thème -->
            <div class="theme-content" x-show="currentTheme" x-cloak>
                <div class="theme-section">
                    <h2 x-text="getThemeName()"></h2>
                    <p class="theme-description" x-text="getThemeDescription()"></p>
                </div>

                <!-- Boutons d'action -->
                <div class="action-buttons">
                    <button @click="toggleIllustration()" class="action-btn btn-visual">
                        🖼️ Voir l'illustration
                    </button>
                    <button @click="showLesson = !showLesson" class="action-btn btn-info">
                        📖 En savoir plus
                    </button>
                    <button @click="startQuiz()" class="action-btn btn-quiz">
                        🎯 Quiz
                    </button>
                </div>
            </div>

            <!-- EN SAVOIR PLUS - CONTENU ÉDUCATIF -->
            <div x-show="showLesson" x-transition class="lesson-container">
                <div class="lesson-header">
                    <h3>📖 <span x-text="getLessonTitle()"></span></h3>
                    <button @click="showLesson = false" class="close-btn">Fermer</button>
                </div>
                <div class="lesson-content" x-html="getLessonContent()"></div>
            </div>

            <!-- ILLUSTRATION -->
            <div x-show="showIllustration" x-transition class="illustration-container">
                <div class="illustration-header">
                    <h3>🖼️ <span x-text="getThemeName()"></span></h3>
                    <button @click="showIllustration = false" class="close-btn">Fermer</button>
                </div>
                <div class="illustration-content">
                    <img :src="getImageUrl()" :alt="'Illustration ' + getThemeName()" class="theme-illustration" loading="lazy">
                </div>
            </div>
        </div>

        <!-- QUIZ -->
        <div x-show="showQuiz" x-transition class="quiz-container">
            <div class="quiz-header">
                <h3>🎯 Quiz <span x-text="getThemeName()"></span></h3>
                <div class="quiz-progress">
                    <p>Question <span x-text="currentQuestionIndex + 1"></span> / <span x-text="getCurrentQuiz().length"></span></p>
                    <div class="progress-bar">
                        <div class="progress-fill" :style="'width: ' + ((currentQuestionIndex + 1) / getCurrentQuiz().length * 100) + '%'"></div>
                    </div>
                </div>
            </div>

            <div class="quiz-content">
                <div x-show="!quizFinished" class="question-zone">
                    <div class="question-text">
                        <span x-text="currentQuestion.question"></span>
                    </div>

                    <!-- Options de réponse -->
                    <div class="answer-options">
                        <template x-for="(option, index) in currentQuestion.options" :key="index">
                            <button @click="checkAnswer(option)" class="answer-btn" :disabled="answered" x-text="option">
                            </button>
                        </template>
                    </div>

                    <!-- Feedback -->
                    <div x-show="answered" x-transition class="feedback-zone">
                        <div :class="'feedback ' + (isCorrect ? 'correct' : 'incorrect')">
                            <span x-show="isCorrect">✅ Bravo ! C'est correct !</span>
                            <span x-show="!isCorrect">
                                ❌ Pas tout à fait... La bonne réponse était : <strong x-text="currentQuestion.correct"></strong>
                            </span>
                        </div>
                        <div class="feedback-explanation" x-show="currentQuestion.explanation">
                            💡 <span x-text="currentQuestion.explanation"></span>
                        </div>
                        <!-- Bouton "Suivant" supprimé : auto-avance après 2s -->
                    </div>
                </div>

                <!-- Résultats finaux -->
                <div x-show="quizFinished" x-transition class="results-zone">
                    <h3>🎉 Quiz terminé !</h3>
                    <div class="score-display">
                        <div class="score-circle">
                            <span class="score-number" x-text="score"></span>
                            <span class="score-total" x-text="'/ ' + getCurrentQuiz().length"></span>
                        </div>
                        <p class="score-percentage" x-text="Math.round((score / getCurrentQuiz().length) * 100) + '%'"></p>
                        <p class="score-message" x-text="getScoreMessage()"></p>
                    </div>
                    <div class="results-actions">
                        <button @click="retryQuiz()" class="action-btn btn-quiz">
                            🔄 Recommencer
                        </button>
                        <button @click="backToTheme()" class="action-btn btn-info">
                            ← Retour au thème
                        </button>
                    </div>
                </div>
            </div>
        </div>

        </div>

        <!-- Alpine.js CDN -->
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

        <!-- JS inline AVANT Alpine -->
        <script>
            document.addEventListener('alpine:init', () => {
                console.log('🎯 Alpine:init déclenché');

                Alpine.data('curioBubble', () => ({
                    visible: false,
                    currentMessage: '',
                    variant: 'info',
                    autoHideTimer: null,
                    init() { window.curioBubbleInstance = this; },
                    show(m, v = 'info') {
                        if (this.autoHideTimer) clearTimeout(this.autoHideTimer);
                        this.currentMessage = m;
                        this.variant = v;
                        this.visible = true;
                        this.autoHideTimer = setTimeout(() => this.hide(), 5000);
                    },
                    hide() { this.visible = false; }
                }));

                Alpine.data('englishApp', () => ({
                    currentTheme: 'vocabulary',
                    showIllustration: false,
                    showLesson: false,
                    showQuiz: false,
                    showResults: false,
                    currentQuestionIndex: 0,
                    score: 0,
                    selectedAnswer: null,
                    answered: false,
                    isCorrect: false,
                    quizFinished: false,
                    currentQuestion: null,
                    audioContext: null,
                    shuffledQuiz: null,

                    init() {
                        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        console.log('✅ englishApp initialisé');

                        // Initialiser le système XP
                        if (window.SectionXP) {
                            window.SectionXP.init('anglais');
                        }
                    },

                    playCorrectSound() {
                        try {
                            const o = this.audioContext.createOscillator(), g = this.audioContext.createGain();
                            o.connect(g); g.connect(this.audioContext.destination);
                            o.frequency.value = 523; o.type = 'sine';
                            g.gain.setValueAtTime(0.3, this.audioContext.currentTime);
                            g.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.2);
                            o.start(); o.stop(this.audioContext.currentTime + 0.2);
                        } catch (e) { }
                    },

                    playIncorrectSound() {
                        try {
                            const o = this.audioContext.createOscillator(), g = this.audioContext.createGain();
                            o.connect(g); g.connect(this.audioContext.destination);
                            o.frequency.value = 185; o.type = 'triangle';
                            g.gain.setValueAtTime(0.3, this.audioContext.currentTime);
                            g.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.3);
                            o.start(); o.stop(this.audioContext.currentTime + 0.3);
                        } catch (e) { }
                    },

                    themes: {
                        vocabulary: {
                            name: 'Basic Vocabulary',
                            description: 'Learn essential everyday words: family, colors, animals, food',
                            imageUrl: 'images/anglais/illustration_vocabulary.jpg'
                        },
                        phrases: {
                            name: 'Everyday Phrases',
                            description: 'Master common expressions: greetings, questions, time, school',
                            imageUrl: 'images/anglais/illustration_conversation.jpg'
                        },
                        grammar: {
                            name: 'Grammar Basics',
                            description: 'Understand English grammar: verbs, present tense, pronouns, adjectives',
                            imageUrl: 'images/anglais/illustration_grammar.jpg'
                        },
                        numbers: {
                            name: 'Numbers & Time',
                            description: 'Learn to count, tell time, dates and seasons',
                            imageUrl: 'images/anglais/illustration_numbers.jpg'
                        },
                        school: {
                            name: 'At School',
                            description: 'Classroom objects, subjects and school activities',
                            imageUrl: 'images/anglais/illustration_school.jpg'
                        },
                        body: {
                            name: 'My Body & Health',
                            description: 'Body parts, feelings and health expressions',
                            imageUrl: 'images/anglais/illustration_body.jpg'
                        },
                        home: {
                            name: 'At Home',
                            description: 'Rooms, furniture and daily routines',
                            imageUrl: 'images/anglais/illustration_home.jpg'
                        },
                        hobbies: {
                            name: 'Hobbies & Sports',
                            description: 'Activities, sports and leisure vocabulary',
                            imageUrl: 'images/anglais/illustration_hobbies.jpg'
                        },
                        food: {
                            name: 'Food & Meals',
                            description: 'Food vocabulary, meal times and preferences',
                            imageUrl: 'images/anglais/illustration_food.jpg'
                        },
                        weather: {
                            name: 'Weather & Seasons',
                            description: 'Weather expressions and seasonal activities',
                            imageUrl: 'images/anglais/illustration_weather.jpg'
                        }
                    },

                    // Contenus pédagogiques
                    lessonData: {
                        vocabulary: {
                            title: "📚 Basic Vocabulary",
                            content: `
                                <h3>Why learn vocabulary?</h3>
                                <p>Vocabulary is the <strong>foundation of any language</strong>. The more words you know, the better you can express yourself and understand others!</p>

                                <h3>👨‍👩‍👧‍👦 Family & People</h3>
                                <ul>
                                    <li><strong class="english-word">Father</strong> <span class="french-translation">(père)</span> - My father is tall.</li>
                                    <li><strong class="english-word">Mother</strong> <span class="french-translation">(mère)</span> - My mother is kind.</li>
                                    <li><strong class="english-word">Brother</strong> <span class="french-translation">(frère)</span> - I have one brother.</li>
                                    <li><strong class="english-word">Sister</strong> <span class="french-translation">(sœur)</span> - My sister is young.</li>
                                    <li><strong class="english-word">Friend</strong> <span class="french-translation">(ami/amie)</span> - She is my best friend.</li>
                                </ul>

                                <h3>🎨 Colors</h3>
                                <ul>
                                    <li><strong class="english-word">Red</strong> <span class="french-translation">(rouge)</span> - The apple is red.</li>
                                    <li><strong class="english-word">Blue</strong> <span class="french-translation">(bleu)</span> - The sky is blue.</li>
                                    <li><strong class="english-word">Green</strong> <span class="french-translation">(vert)</span> - The grass is green.</li>
                                    <li><strong class="english-word">Yellow</strong> <span class="french-translation">(jaune)</span> - The sun is yellow.</li>
                                    <li><strong class="english-word">Black</strong> <span class="french-translation">(noir)</span>, <strong class="english-word">White</strong> <span class="french-translation">(blanc)</span></li>
                                </ul>

                                <h3>🔢 Numbers 1-10</h3>
                                <ul>
                                    <li><strong class="english-word">One</strong> (1), <strong class="english-word">Two</strong> (2), <strong class="english-word">Three</strong> (3), <strong class="english-word">Four</strong> (4), <strong class="english-word">Five</strong> (5)</li>
                                    <li><strong class="english-word">Six</strong> (6), <strong class="english-word">Seven</strong> (7), <strong class="english-word">Eight</strong> (8), <strong class="english-word">Nine</strong> (9), <strong class="english-word">Ten</strong> (10)</li>
                                </ul>

                                <h3>🐶 Animals</h3>
                                <ul>
                                    <li><strong class="english-word">Dog</strong> <span class="french-translation">(chien)</span> - The dog barks.</li>
                                    <li><strong class="english-word">Cat</strong> <span class="french-translation">(chat)</span> - The cat meows.</li>
                                    <li><strong class="english-word">Bird</strong> <span class="french-translation">(oiseau)</span> - The bird sings.</li>
                                    <li><strong class="english-word">Fish</strong> <span class="french-translation">(poisson)</span> - The fish swims.</li>
                                    <li><strong class="english-word">Horse</strong> <span class="french-translation">(cheval)</span>, <strong class="english-word">Rabbit</strong> <span class="french-translation">(lapin)</span></li>
                                </ul>

                                <h3>🍎 Food & Drinks</h3>
                                <ul>
                                    <li><strong class="english-word">Apple</strong> <span class="french-translation">(pomme)</span> - I eat an apple.</li>
                                    <li><strong class="english-word">Bread</strong> <span class="french-translation">(pain)</span> - I like bread.</li>
                                    <li><strong class="english-word">Water</strong> <span class="french-translation">(eau)</span> - I drink water.</li>
                                    <li><strong class="english-word">Milk</strong> <span class="french-translation">(lait)</span> - Milk is white.</li>
                                    <li><strong class="english-word">Cake</strong> <span class="french-translation">(gâteau)</span>, <strong class="english-word">Juice</strong> <span class="french-translation">(jus)</span></li>
                                </ul>

                                <h3>💡 Learning Tips</h3>
                                <ul>
                                    <li>📝 Practice writing new words every day</li>
                                    <li>🗣️ Say words out loud to remember pronunciation</li>
                                    <li>🎨 Draw pictures to associate with words</li>
                                    <li>🎮 Use flashcards or play memory games</li>
                                </ul>
                            `
                        },
                        phrases: {
                            title: "💬 Everyday Phrases",
                            content: `
                                <h3>Why learn phrases?</h3>
                                <p>Knowing <strong>common phrases</strong> helps you communicate in real situations. You can make friends, ask for help, and express yourself!</p>

                                <h3>👋 Greetings</h3>
                                <ul>
                                    <li><strong class="english-word">Hello!</strong> / <strong class="english-word">Hi!</strong> <span class="french-translation">(Bonjour / Salut)</span></li>
                                    <li><strong class="english-word">Good morning!</strong> <span class="french-translation">(Bonjour - matin)</span></li>
                                    <li><strong class="english-word">Good afternoon!</strong> <span class="french-translation">(Bon après-midi)</span></li>
                                    <li><strong class="english-word">Good evening!</strong> <span class="french-translation">(Bonsoir)</span></li>
                                    <li><strong class="english-word">Goodbye!</strong> / <strong class="english-word">Bye!</strong> <span class="french-translation">(Au revoir)</span></li>
                                    <li><strong class="english-word">See you later!</strong> <span class="french-translation">(À plus tard)</span></li>
                                </ul>

                                <h3>🙋 Introducing Yourself</h3>
                                <ul>
                                    <li><strong class="english-word">My name is...</strong> <span class="french-translation">(Je m'appelle...)</span></li>
                                    <li><strong class="english-word">I am 10 years old.</strong> <span class="french-translation">(J'ai 10 ans)</span></li>
                                    <li><strong class="english-word">Nice to meet you!</strong> <span class="french-translation">(Enchanté/e)</span></li>
                                    <li><strong class="english-word">How are you?</strong> <span class="french-translation">(Comment vas-tu ?)</span></li>
                                    <li><strong class="english-word">I'm fine, thank you.</strong> <span class="french-translation">(Je vais bien, merci)</span></li>
                                </ul>

                                <h3>❓ Common Questions</h3>
                                <ul>
                                    <li><strong class="english-word">What is your name?</strong> <span class="french-translation">(Comment t'appelles-tu ?)</span></li>
                                    <li><strong class="english-word">How old are you?</strong> <span class="french-translation">(Quel âge as-tu ?)</span></li>
                                    <li><strong class="english-word">Where are you from?</strong> <span class="french-translation">(D'où viens-tu ?)</span></li>
                                    <li><strong class="english-word">What time is it?</strong> <span class="french-translation">(Quelle heure est-il ?)</span></li>
                                    <li><strong class="english-word">Can you help me?</strong> <span class="french-translation">(Peux-tu m'aider ?)</span></li>
                                </ul>

                                <h3>🏫 At School</h3>
                                <ul>
                                    <li><strong class="english-word">I go to school.</strong> <span class="french-translation">(Je vais à l'école)</span></li>
                                    <li><strong class="english-word">I like English.</strong> <span class="french-translation">(J'aime l'anglais)</span></li>
                                    <li><strong class="english-word">Can I go to the bathroom?</strong> <span class="french-translation">(Puis-je aller aux toilettes ?)</span></li>
                                    <li><strong class="english-word">I don't understand.</strong> <span class="french-translation">(Je ne comprends pas)</span></li>
                                    <li><strong class="english-word">Homework</strong> <span class="french-translation">(devoirs)</span>, <strong class="english-word">Teacher</strong> <span class="french-translation">(professeur)</span></li>
                                </ul>

                                <h3>🕐 Days & Time</h3>
                                <ul>
                                    <li><strong class="english-word">Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday</strong></li>
                                    <li><strong class="english-word">Today</strong> <span class="french-translation">(aujourd'hui)</span>, <strong class="english-word">Tomorrow</strong> <span class="french-translation">(demain)</span>, <strong class="english-word">Yesterday</strong> <span class="french-translation">(hier)</span></li>
                                    <li><strong class="english-word">It's 3 o'clock.</strong> <span class="french-translation">(Il est 3 heures)</span></li>
                                </ul>

                                <h3>😊 Polite Expressions</h3>
                                <ul>
                                    <li><strong class="english-word">Please</strong> <span class="french-translation">(S'il te plaît)</span></li>
                                    <li><strong class="english-word">Thank you</strong> / <strong class="english-word">Thanks</strong> <span class="french-translation">(Merci)</span></li>
                                    <li><strong class="english-word">You're welcome</strong> <span class="french-translation">(De rien)</span></li>
                                    <li><strong class="english-word">Excuse me</strong> / <strong class="english-word">Sorry</strong> <span class="french-translation">(Excuse-moi / Pardon)</span></li>
                                </ul>
                            `
                        },
                        grammar: {
                            title: "📖 Grammar Basics",
                            content: `
                                <h3>Why learn grammar?</h3>
                                <p>Grammar is the <strong>structure of language</strong>. It helps you build correct sentences and express yourself clearly!</p>

                                <h3>🔤 Personal Pronouns</h3>
                                <ul>
                                    <li><strong class="english-word">I</strong> <span class="french-translation">(je)</span> - I am a student.</li>
                                    <li><strong class="english-word">You</strong> <span class="french-translation">(tu/vous)</span> - You are nice.</li>
                                    <li><strong class="english-word">He</strong> <span class="french-translation">(il)</span> - He is my brother.</li>
                                    <li><strong class="english-word">She</strong> <span class="french-translation">(elle)</span> - She is my sister.</li>
                                    <li><strong class="english-word">It</strong> <span class="french-translation">(il/elle - chose)</span> - It is a book.</li>
                                    <li><strong class="english-word">We</strong> <span class="french-translation">(nous)</span> - We are friends.</li>
                                    <li><strong class="english-word">They</strong> <span class="french-translation">(ils/elles)</span> - They are happy.</li>
                                </ul>

                                <h3>📝 Present Simple - Verb "TO BE"</h3>
                                <ul>
                                    <li><strong class="english-word">I am</strong> (I'm) - I am 10 years old.</li>
                                    <li><strong class="english-word">You are</strong> (You're) - You are smart.</li>
                                    <li><strong class="english-word">He is / She is / It is</strong> (He's/She's/It's) - He is tall.</li>
                                    <li><strong class="english-word">We are</strong> (We're) - We are students.</li>
                                    <li><strong class="english-word">They are</strong> (They're) - They are my friends.</li>
                                </ul>

                                <h3>🏃 Action Verbs</h3>
                                <ul>
                                    <li><strong class="english-word">Run</strong> <span class="french-translation">(courir)</span> - I run fast.</li>
                                    <li><strong class="english-word">Jump</strong> <span class="french-translation">(sauter)</span> - She jumps high.</li>
                                    <li><strong class="english-word">Eat</strong> <span class="french-translation">(manger)</span> - They eat lunch.</li>
                                    <li><strong class="english-word">Drink</strong> <span class="french-translation">(boire)</span> - We drink water.</li>
                                    <li><strong class="english-word">Sleep</strong> <span class="french-translation">(dormir)</span> - He sleeps at night.</li>
                                    <li><strong class="english-word">Play</strong> <span class="french-translation">(jouer)</span> - I play football.</li>
                                    <li><strong class="english-word">Read</strong> <span class="french-translation">(lire)</span> - You read a book.</li>
                                    <li><strong class="english-word">Write</strong> <span class="french-translation">(écrire)</span> - She writes a letter.</li>
                                </ul>

                                <h3>🎯 Adjectives</h3>
                                <p>Adjectives <strong>describe nouns</strong> (people, places, things):</p>
                                <ul>

                    // Mélanger un tableau (Fisher-Yates)
                    shuffleArray(array) {
                        const shuffled = [...array];
                        for (let i = shuffled.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                        }
                        return shuffled;

                    canStartQuiz(theme) {
                        const cooldownKey = `quiz_cooldown_anglais_${theme}`;
                        const cooldownData = JSON.parse(localStorage.getItem(cooldownKey) || '{}');

                        if (!cooldownData.lastCompleted) return true;

                        const now = Date.now();
                        const timeSinceCompletion = now - cooldownData.lastCompleted;
                        const cooldownDuration = 24 * 60 * 60 * 1000; // 24 heures

                        return timeSinceCompletion >= cooldownDuration;
                    },

                    // Obtenir temps restant avant déblocage
                    getCooldownTimeRemaining(theme) {
                        const cooldownKey = `quiz_cooldown_anglais_${theme}`;
                        const cooldownData = JSON.parse(localStorage.getItem(cooldownKey) || '{}');

                        if (!cooldownData.lastCompleted) return null;

                        const now = Date.now();
                        const timeSinceCompletion = now - cooldownData.lastCompleted;
                        const cooldownDuration = 24 * 60 * 60 * 1000;
                        const remaining = cooldownDuration - timeSinceCompletion;

                        if (remaining <= 0) return null;

                        const hours = Math.floor(remaining / (60 * 60 * 1000));
                        const minutes = Math.floor((remaining % (60 * 60 * 1000)) / (60 * 1000));

                        return { hours, minutes };
                    },

                    // Enregistrer cooldown après complétion
                    recordQuizCompletion(theme) {
                        const cooldownKey = `quiz_cooldown_anglais_${theme}`;
                        const cooldownData = {
                            lastCompleted: Date.now(),
                            count: (JSON.parse(localStorage.getItem(cooldownKey) || '{}').count || 0) + 1
                        };
                        localStorage.setItem(cooldownKey, JSON.stringify(cooldownData));
                        console.log(`🔒 Cooldown activé pour ${theme} jusqu'à`, new Date(cooldownData.lastCompleted + 24*60*60*1000).toLocaleString('fr-FR'));
                    },

                    startQuiz() {
                        // ✅ VÉRIFIER COOLDOWN
                        if (!this.canStartQuiz(this.currentTheme)) {
                            const remaining = this.getCooldownTimeRemaining(this.currentTheme);
                            const message = `⏰ Quiz déjà complété aujourd'hui !\n\nReviens dans ${remaining.hours}h ${remaining.minutes}min pour le refaire.`;

                            if (window.curioBubbleInstance) {
                                window.curioBubbleInstance.show(message, 'info');
                            } else {
                                alert(message);
                            }
                            return; // BLOQUER le démarrage
                        }

                        // ✨ NOUVEAU : Mélanger les options des questions
                        const quiz = this.quizQuestions[this.currentTheme] || [];
                        this.shuffledQuiz = quiz.map(q => {
                            const shuffledOptions = this.shuffleArray([...q.options]);
                            return { ...q, options: shuffledOptions };
                        });

                        this.showQuiz = true;
                        this.showResults = false;
                        this.currentQuestionIndex = this.score = 0;
                        this.selectedAnswer = null;
                        this.answered = false;
                        this.quizFinished = false;
                        this.loadQuestion();
                    },

                    getCurrentQuiz() {
                        return this.shuffledQuiz || this.quizQuestions[this.currentTheme] || [];
                    },

                    loadQuestion() {
                        const questions = this.getCurrentQuiz();
                        this.currentQuestion = questions[this.currentQuestionIndex];
                        this.answered = false;
                        this.isCorrect = false;
                    },

                    checkAnswer(selectedOption) {
                        if (this.answered) return;
                        this.answered = true;
                        this.isCorrect = (selectedOption === this.currentQuestion.correct);
                        if (this.isCorrect) {
                            this.score++;
                            this.playCorrectSound();

                            // Ajouter XP pour bonne réponse
                            if (window.SectionXP) {
                                window.SectionXP.addXP('anglais', window.SectionXP.rewards.QUESTION_CORRECT);
                            }
                        } else {
                            this.playIncorrectSound();
                        }

                        // ✅ AUTO-AVANCE : Timer 2 secondes puis question suivante
                        setTimeout(() => {
                            this.nextQuestion();
                        }, 2000);
                    },

                    nextQuestion() {
                        if (this.currentQuestionIndex < this.shuffledQuiz.length - 1) {
                            this.currentQuestionIndex++;
                            this.loadQuestion();
                        } else {
                            this.finishQuiz();
                        }

                        // ========================================================================

                                // Context pour bonus automatiques
                                const englishData = gameSystem.getSectionData('english');
                                const context = {
                                    perfectScore: percentage === 100,
                                    hasActiveStreak: englishData.streak > 0
                                };

                                // Attribution XP avec bonus (Perfect Score x2, Streak +50%)
                                const earnedXP = gameSystem.awardXP('english', baseXP, context);

                                // Enregistrer complétion leçon
                                gameSystem.completeLesson('english', lessonId, percentage, 0);

                                // Mettre à jour streak quotidien
                                gameSystem.updateStreak('english');

                                // Mettre à jour affichage badges
                                if (typeof updateGameSystemUI === 'function') {
                                    updateGameSystemUI();
                                }

                                console.log(`✅ MasterGameSystem: +${earnedXP} XP (base: ${baseXP}, score: ${percentage}%)`);

                            } catch (error) {
                                console.error('❌ Erreur MasterGameSystem:', error);
                                // Fallback: ancien système continue de fonctionner
                            }
                        }
                        // ========================================================================

                            }
                        }

                        // --- BADGE SYSTEM : écriture quiz_stats ---
                        try {
                            const raw = localStorage.getItem('lemondedescurieux_quiz_stats');
                            const stats = raw ? JSON.parse(raw) : { totalCompleted: 0, perfectCount: 0, bySubject: { francais: 0, anglais: 0, maths: 0, sciences: 0, histoire: 0 } };
                            stats.totalCompleted = (stats.totalCompleted || 0) + 1;
                            if (isPerfect) stats.perfectCount = (stats.perfectCount || 0) + 1;
                            if (!stats.bySubject) stats.bySubject = {};
                            stats.bySubject.anglais = (stats.bySubject.anglais || 0) + 1;
                            localStorage.setItem('lemondedescurieux_quiz_stats', JSON.stringify(stats));
                            console.log('📊 [anglais] Quiz stats mis à jour:', stats);
                        } catch(e) { console.warn('[anglais] Erreur stats quiz:', e); }

                        // --- BADGE SYSTEM : check + sync ---
                        if (window.badgeSystem) {
                            const newBadges = window.badgeSystem.checkBadges();
                            if (newBadges && newBadges.length > 0) {
                                console.log('🏆 [anglais] Nouveaux badges:', newBadges.map(b => b.name));
                                if (window.curioBubbleInstance && newBadges[0]) {
                                    window.curioBubbleInstance.show('🏆 Badge débloqué : ' + newBadges[0].name + ' !', 'success');
                                }
                            }
                            if (window.BRIDGE) window.BRIDGE.syncBadges();
                        }

                        // ✅ ENREGISTRER COOLDOWN (24h)
                        this.recordQuizCompletion(this.currentTheme);
                    },

                    retryQuiz() {
                        // ✅ VÉRIFIER COOLDOWN même pour retry
                        if (!this.canStartQuiz(this.currentTheme)) {
                            const remaining = this.getCooldownTimeRemaining(this.currentTheme);
                            const message = `⏰ Quiz déjà complété aujourd'hui !\n\nReviens dans ${remaining.hours}h ${remaining.minutes}min pour le refaire.`;

                            if (window.curioBubbleInstance) {
                                window.curioBubbleInstance.show(message, 'info');
                            } else {
                                alert(message);
                            }
                            // Fermer le quiz au lieu de retry
                            this.backToTheme();
                            return;
                        }

                        this.quizFinished = false;
                        this.currentQuestionIndex = this.score = 0;
                        this.loadQuestion();
                    },

                    getScoreMessage() {
                        const percentage = (this.score / this.getCurrentQuiz().length) * 100;
                        if (percentage === 100) return '🏆 Perfect! You mastered this theme!';
                        if (percentage >= 80) return '🌟 Excellent! Very well done!';
                        if (percentage >= 60) return '👍 Good job! Keep it up!';
                        if (percentage >= 40) return '💪 Not bad! Practice a bit more!';
                        return '📚 Keep learning, you\'ll get there!';
                    },

                    backToTheme() {
                        this.showResults = false;
                        this.showQuiz = false;
                    }
                }));
            });
        </script>
