        <!-- Bulle Curio -->
        <div x-data="curioBubble" x-show="visible" x-transition :class="'curio-bubble ' + variant">
            <button @click="hide()" class="curio-close" aria-label="Fermer">×</button>
            <div class="curio-avatar">🦊</div>
            <p class="curio-message" x-text="currentMessage"></p>
        </div>

        <main class="english-container" id="main-content">
            <!-- Header avec bouton retour -->
            <div class="section-header">
                <!-- FIX NAV : window.location.href à la place de history.back() -->
                <button onclick="window.location.href='index.html'" class="back-btn">
                    ← Retour à l'accueil
                </button>
            </div>

            <!-- Titre section -->
            <div class="section-title">
                <h1>🇬🇧 Learn English!</h1>
                <p>Discover English through fun and interactive activities!</p>
            </div>

            <!-- Navigation thèmes -->
            <div class="themes-nav" role="navigation" aria-label="Thèmes disponibles">
                <button @click="selectTheme('vocabulary')"
                    :class="'theme-btn vocabulary' + (currentTheme === 'vocabulary' ? ' active' : '')" :aria-pressed="currentTheme === 'vocabulary'">
                    📚 Basic Vocabulary
                </button>
                <button @click="selectTheme('phrases')"
                    :class="'theme-btn phrases' + (currentTheme === 'phrases' ? ' active' : '')" :aria-pressed="currentTheme === 'phrases'">
                    💬 Everyday Phrases
                </button>
                <button @click="selectTheme('grammar')"
                    :class="'theme-btn grammar' + (currentTheme === 'grammar' ? ' active' : '')" :aria-pressed="currentTheme === 'grammar'">
                    📖 Grammar Basics
                </button>
                <button @click="selectTheme('numbers')"
                    :class="'theme-btn numbers' + (currentTheme === 'numbers' ? ' active' : '')" :aria-pressed="currentTheme === 'numbers'">
                    🔢 Numbers & Time
                </button>
                <button @click="selectTheme('school')"
                    :class="'theme-btn school' + (currentTheme === 'school' ? ' active' : '')" :aria-pressed="currentTheme === 'school'">
                    🏫 At School
                </button>
                <button @click="selectTheme('body')"
                    :class="'theme-btn body' + (currentTheme === 'body' ? ' active' : '')" :aria-pressed="currentTheme === 'body'">
                    🧍 My Body & Health
                </button>
                <button @click="selectTheme('home')"
                    :class="'theme-btn home' + (currentTheme === 'home' ? ' active' : '')" :aria-pressed="currentTheme === 'home'">
                    🏠 At Home
                </button>
                <button @click="selectTheme('hobbies')"
                    :class="'theme-btn hobbies' + (currentTheme === 'hobbies' ? ' active' : '')" :aria-pressed="currentTheme === 'hobbies'">
                    ⚽ Hobbies & Sports
                </button>
                <button @click="selectTheme('food')"
                    :class="'theme-btn food' + (currentTheme === 'food' ? ' active' : '')" :aria-pressed="currentTheme === 'food'">
                    🍽️ Food & Meals
                </button>
                <button @click="selectTheme('weather')"
                    :class="'theme-btn weather' + (currentTheme === 'weather' ? ' active' : '')" :aria-pressed="currentTheme === 'weather'">
                    ☀️ Weather & Seasons
                </button>
            </div>

            <!-- Contenu thème -->
            <div class="theme-content" x-show="currentTheme" x-cloak>
                <div class="theme-section">
                    <h2 x-text="getThemeName()"></h2>
                    <p class="theme-description" x-text="getThemeDescription()"></p>
                </div>

                <!-- Boutons d'action -->
                <div class="action-buttons">
                    <button @click="toggleIllustration()" class="action-btn btn-visual" aria-label="Voir l'illustration">
                        🖼️ Voir l'illustration
                    </button>
                    <button @click="showLesson = !showLesson" class="action-btn btn-info" aria-label="En savoir plus">
                        📖 En savoir plus
                    </button>
                    <button @click="startQuiz()" class="action-btn btn-quiz" aria-label="Démarrer le quiz">
                        🎯 Quiz
                    </button>
                </div>
            </div>

            <!-- EN SAVOIR PLUS - CONTENU ÉDUCATIF -->
            <div x-show="showLesson" x-transition class="lesson-container">
                <div class="lesson-header">
                    <h3>📖 <span x-text="getLessonTitle()"></span></h3>
                    <button @click="showLesson = false" class="close-btn" aria-label="Fermer">Fermer</button>
                </div>
                <div class="lesson-content" x-html="getLessonContent()"></div>
            </div>

            <!-- ILLUSTRATION -->
            <div x-show="showIllustration" x-transition class="illustration-container">
                <div class="illustration-header">
                    <h3>🖼️ <span x-text="getThemeName()"></span></h3>
                    <button @click="showIllustration = false" class="close-btn" aria-label="Fermer">Fermer</button>
                </div>
                <div class="illustration-content">
                    <img :src="getImageUrl()" :alt="'Illustration ' + getThemeName()" class="theme-illustration" loading="lazy">
                </div>
            </div>
        </main>

        <!-- QUIZ -->
        <div x-show="showQuiz" x-transition class="quiz-container">
            <div class="quiz-header">
                <h3>🎯 Quiz <span x-text="getThemeName()"></span></h3>
                <div class="quiz-progress">
                    <p>Question <span x-text="currentQuestionIndex + 1"></span> / <span x-text="getCurrentQuiz().length"></span></p>
                    <!-- FIX WCAG : ajout :aria-valuenow dynamique -->
                    <div class="progress-bar" role="progressbar"
                        :aria-valuenow="Math.round((currentQuestionIndex + 1) / getCurrentQuiz().length * 100)"
                        aria-valuemin="0" aria-valuemax="100" aria-label="Progression du quiz">
                        <div class="progress-fill" :style="'width: ' + ((currentQuestionIndex + 1) / getCurrentQuiz().length * 100) + '%'"></div>
                    </div>
                </div>
            </div>

            <div class="quiz-content">
                <div x-show="!quizFinished" class="question-zone">
                    <div class="question-text">
                        <span x-text="currentQuestion.question"></span>
                    </div>

                    <!-- Options de réponse -->
                    <div class="answer-options">
                        <template x-for="(option, index) in currentQuestion.options" :key="index">
                            <button @click="checkAnswer(option)" class="answer-btn" :disabled="answered" x-text="option" :aria-label="option">
                            </button>
                        </template>
                    </div>

                    <!-- Feedback -->
                    <div x-show="answered" x-transition class="feedback-zone" aria-live="polite" aria-atomic="true">
                        <div :class="'feedback ' + (isCorrect ? 'correct' : 'incorrect')">
                            <span x-show="isCorrect">✅ Bravo ! C'est correct !</span>
                            <span x-show="!isCorrect">
                                ❌ Pas tout à fait... La bonne réponse était : <strong x-text="currentQuestion.correct"></strong>
                            </span>
                        </div>
                        <div class="feedback-explanation" x-show="currentQuestion.explanation">
                            💡 <span x-text="currentQuestion.explanation"></span>
                        </div>
                    </div>
                </div>

                <!-- Résultats finaux -->
                <div x-show="quizFinished" x-transition class="results-zone" aria-live="polite">
                    <h3>🎉 Quiz terminé !</h3>
                    <div class="score-display">
                        <div class="score-circle">
                            <span class="score-number" x-text="score"></span>
                            <span class="score-total" x-text="'/ ' + getCurrentQuiz().length"></span>
                        </div>
                        <p class="score-percentage" x-text="Math.round((score / getCurrentQuiz().length) * 100) + '%'"></p>
                        <p class="score-message" x-text="getScoreMessage()"></p>
                    </div>
                    <div class="results-actions">
                        <button @click="retryQuiz()" class="action-btn btn-quiz" aria-label="Recommencer le quiz">
                            🔄 Recommencer
                        </button>
                        <button @click="backToTheme()" class="action-btn btn-info" aria-label="Retour au thème">
                            ← Retour au thème
                        </button>
                    </div>
                </div>
            </div>
        </div>

        </div>

        <!-- Alpine.js CDN -->
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

        <!-- JS inline AVANT Alpine -->
        <script>
            document.addEventListener('alpine:init', () => {
                Alpine.data('curioBubble', () => ({
                    visible: false,
                    currentMessage: '',
                    variant: 'info',
                    autoHideTimer: null,
                    init() { window.curioBubbleInstance = this; },
                    show(m, v = 'info') {
                        if (this.autoHideTimer) clearTimeout(this.autoHideTimer);
                        this.currentMessage = m;
                        this.variant = v;
                        this.visible = true;
                        this.autoHideTimer = setTimeout(() => this.hide(), 5000);
                    },
                    hide() { this.visible = false; }
                }));

                Alpine.data('englishApp', () => ({
                    currentTheme: 'vocabulary',
                    showIllustration: false,
                    showLesson: false,
                    showQuiz: false,
                    showResults: false,
                    currentQuestionIndex: 0,
                    score: 0,
                    selectedAnswer: null,
                    answered: false,
                    isCorrect: false,
                    quizFinished: false,
                    currentQuestion: null,
                    audioContext: null,
                    shuffledQuiz: null,

                    init() {
                        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        if (window.SectionXP) window.SectionXP.init('anglais');
                    },

                    playCorrectSound() {
                        try {
                            const o = this.audioContext.createOscillator(), g = this.audioContext.createGain();
                            o.connect(g); g.connect(this.audioContext.destination);
                            o.frequency.value = 523; o.type = 'sine';
                            g.gain.setValueAtTime(0.3, this.audioContext.currentTime);
                            g.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.2);
                            o.start(); o.stop(this.audioContext.currentTime + 0.2);
                        } catch (e) { }
                    },

                    playIncorrectSound() {
                        try {
                            const o = this.audioContext.createOscillator(), g = this.audioContext.createGain();
                            o.connect(g); g.connect(this.audioContext.destination);
                            o.frequency.value = 185; o.type = 'triangle';
                            g.gain.setValueAtTime(0.3, this.audioContext.currentTime);
                            g.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.3);
                            o.start(); o.stop(this.audioContext.currentTime + 0.3);
                        } catch (e) { }
                    },

                    themes: {
                        vocabulary: { name: 'Basic Vocabulary', description: 'Learn essential everyday words: family, colors, animals, food', imageUrl:'images/anglais/illustration_vocabulary.webp' },
                        phrases: { name: 'Everyday Phrases', description: 'Master common expressions: greetings, questions, time, school', imageUrl:'images/anglais/illustration_conversation.webp' },
                        grammar: { name: 'Grammar Basics', description: 'Understand English grammar: verbs, present tense, pronouns, adjectives', imageUrl:'images/anglais/illustration_grammar.webp' },
                        numbers: { name: 'Numbers & Time', description: 'Learn to count, tell time, dates and seasons', imageUrl: 'images/anglais/illustration_numbers.jpg' },
                        school: { name: 'At School', description: 'Classroom objects, subjects and school activities', imageUrl: 'images/anglais/illustration_school.jpg' },
                        body: { name: 'My Body & Health', description: 'Body parts, feelings and health expressions', imageUrl: 'images/anglais/illustration_body.jpg' },
                        home: { name: 'At Home', description: 'Rooms, furniture and daily routines', imageUrl: 'images/anglais/illustration_home.jpg' },
                        hobbies: { name: 'Hobbies & Sports', description: 'Activities, sports and leisure vocabulary', imageUrl: 'images/anglais/illustration_hobbies.jpg' },
                        food: { name: 'Food & Meals', description: 'Food vocabulary, meal times and preferences', imageUrl: 'images/anglais/illustration_food.jpg' },
                        weather: { name: 'Weather & Seasons', description: 'Weather expressions and seasonal activities', imageUrl: 'images/anglais/illustration_weather.jpg' }
                    },

                    lessonData: {
                        vocabulary: { title: "📚 Basic Vocabulary", content: `<h3>Why learn vocabulary?</h3><p>Vocabulary is the <strong>foundation of any language</strong>. The more words you know, the better you can express yourself!</p><h3>👨‍👩‍👧‍👦 Family</h3><ul><li><strong>Father</strong> (père), <strong>Mother</strong> (mère), <strong>Brother</strong> (frère), <strong>Sister</strong> (sœur)</li></ul><h3>🎨 Colors</h3><ul><li><strong>Red</strong> (rouge), <strong>Blue</strong> (bleu), <strong>Green</strong> (vert), <strong>Yellow</strong> (jaune)</li></ul><h3>🐶 Animals</h3><ul><li><strong>Dog</strong> (chien), <strong>Cat</strong> (chat), <strong>Bird</strong> (oiseau), <strong>Fish</strong> (poisson)</li></ul>` },
                        phrases: { title: "💬 Everyday Phrases", content: `<h3>Greetings</h3><ul><li><strong>Hello!</strong> / <strong>Hi!</strong> (Bonjour)</li><li><strong>Goodbye!</strong> / <strong>Bye!</strong> (Au revoir)</li><li><strong>Thank you</strong> (Merci), <strong>Please</strong> (S'il te plaît)</li></ul><h3>Questions</h3><ul><li><strong>What is your name?</strong> (Comment t'appelles-tu ?)</li><li><strong>How old are you?</strong> (Quel âge as-tu ?)</li></ul>` },
                        grammar: { title: "📖 Grammar Basics", content: `<h3>Personal Pronouns</h3><ul><li><strong>I</strong> (je), <strong>You</strong> (tu), <strong>He</strong> (il), <strong>She</strong> (elle)</li><li><strong>We</strong> (nous), <strong>They</strong> (ils/elles)</li></ul><h3>Verb TO BE</h3><ul><li>I <strong>am</strong>, You <strong>are</strong>, He/She <strong>is</strong>, We/They <strong>are</strong></li></ul>` }
                    },

                    quizQuestions: {
                        vocabulary: [
                            { question: "Comment dit-on 'mère' en anglais ?", options: ["Mother", "Father", "Sister", "Brother"], correct: "Mother", explanation: "'Mother' signifie 'mère' en anglais." },
                            { question: "Quelle est la couleur du ciel ?", options: ["Red", "Blue", "Green", "Yellow"], correct: "Blue", explanation: "The sky is blue = Le ciel est bleu." },
                            { question: "Comment dit-on 'chien' en anglais ?", options: ["Cat", "Dog", "Bird", "Fish"], correct: "Dog", explanation: "'Dog' signifie 'chien' en anglais." },
                            { question: "Combien font 'five + three' ?", options: ["Seven", "Eight", "Nine", "Ten"], correct: "Eight", explanation: "5 + 3 = 8 (eight)" },
                            { question: "Comment dit-on 'pomme' en anglais ?", options: ["Apple", "Banana", "Orange", "Pear"], correct: "Apple", explanation: "'Apple' signifie 'pomme' en anglais." },
                            { question: "De quelle couleur est l'herbe (grass) ?", options: ["Red", "Blue", "Green", "Yellow"], correct: "Green", explanation: "The grass is green = L'herbe est verte." },
                            { question: "Quel animal dit 'meow' ?", options: ["Dog", "Cat", "Bird", "Horse"], correct: "Cat", explanation: "Le chat (cat) fait 'meow' (miaou)." },
                            { question: "Comment dit-on 'eau' en anglais ?", options: ["Water", "Milk", "Juice", "Tea"], correct: "Water", explanation: "'Water' signifie 'eau' en anglais." },
                            { question: "Quel est le numéro après 'nine' ?", options: ["Eight", "Ten", "Eleven", "Seven"], correct: "Ten", explanation: "Après 9 (nine) vient 10 (ten)." },
                            { question: "Comment dit-on 'ami' en anglais ?", options: ["Friend", "Enemy", "Stranger", "Neighbor"], correct: "Friend", explanation: "'Friend' signifie 'ami/amie' en anglais." }
                        ],
                        phrases: [
                            { question: "Comment dit-on 'Bonjour' en anglais ?", options: ["Goodbye", "Hello", "Thank you", "Sorry"], correct: "Hello", explanation: "'Hello' ou 'Hi' signifient 'Bonjour' en anglais." },
                            { question: "Quelle phrase signifie 'Comment t'appelles-tu ?' ?", options: ["How are you?", "What is your name?", "Where are you?", "How old are you?"], correct: "What is your name?", explanation: "'What is your name?' = Comment t'appelles-tu ?" },
                            { question: "Comment dit-on 'Merci' en anglais ?", options: ["Please", "Sorry", "Thank you", "Excuse me"], correct: "Thank you", explanation: "'Thank you' ou 'Thanks' signifient 'Merci'." },
                            { question: "Quelle phrase signifie 'Au revoir' ?", options: ["Hello", "Goodbye", "Good morning", "Good night"], correct: "Goodbye", explanation: "'Goodbye' ou 'Bye' signifient 'Au revoir'." },
                            { question: "Comment demander l'âge de quelqu'un ?", options: ["What is your name?", "How old are you?", "Where are you from?", "How are you?"], correct: "How old are you?", explanation: "'How old are you?' = Quel âge as-tu ?" },
                            { question: "Quel jour vient après Monday ?", options: ["Sunday", "Tuesday", "Wednesday", "Friday"], correct: "Tuesday", explanation: "Lundi (Monday) → Mardi (Tuesday)" },
                            { question: "Comment dit-on 'S'il te plaît' ?", options: ["Thank you", "Please", "Sorry", "Welcome"], correct: "Please", explanation: "'Please' signifie 'S'il te plaît' en anglais." },
                            { question: "Quelle phrase signifie 'Je ne comprends pas' ?", options: ["I understand", "I don't understand", "I know", "I like"], correct: "I don't understand", explanation: "'I don't understand' = Je ne comprends pas." },
                            { question: "Comment dit-on 'Quelle heure est-il ?' ?", options: ["What time is it?", "What day is it?", "What is it?", "When is it?"], correct: "What time is it?", explanation: "'What time is it?' = Quelle heure est-il ?" },
                            { question: "Quel mot signifie 'aujourd'hui' ?", options: ["Yesterday", "Tomorrow", "Today", "Now"], correct: "Today", explanation: "'Today' = aujourd'hui, 'Yesterday' = hier, 'Tomorrow' = demain" }
                        ],
                        grammar: [
                            { question: "Quel pronom remplace 'Marie' ?", options: ["He", "She", "It", "They"], correct: "She", explanation: "'She' (elle) est utilisé pour une fille/femme." },
                            { question: "Complète : 'I ___ a student.'", options: ["am", "is", "are", "be"], correct: "am", explanation: "Avec 'I', on utilise 'am' : I am = Je suis" },
                            { question: "Complète : 'He ___ tall.'", options: ["am", "is", "are", "be"], correct: "is", explanation: "Avec He/She/It, on utilise 'is' : He is = Il est" },
                            { question: "Quel verbe signifie 'courir' ?", options: ["Walk", "Run", "Jump", "Sleep"], correct: "Run", explanation: "'Run' signifie 'courir' en anglais." },
                            { question: "Quel adjectif signifie 'grand' (taille) ?", options: ["Small", "Short", "Big", "Little"], correct: "Big", explanation: "'Big' signifie 'grand', 'Small' signifie 'petit'." },
                            { question: "Quel mot pose une question sur le lieu ?", options: ["What", "Who", "Where", "When"], correct: "Where", explanation: "'Where?' = Où ? (pour demander un lieu)" },
                            { question: "Complète : 'They ___ happy.'", options: ["am", "is", "are", "be"], correct: "are", explanation: "Avec You/We/They, on utilise 'are' : They are = Ils sont" },
                            { question: "Quel pronom pour parler de soi-même ?", options: ["You", "He", "I", "We"], correct: "I", explanation: "'I' (je) est utilisé pour parler de soi-même." },
                            { question: "Quel adjectif signifie 'heureux' ?", options: ["Sad", "Happy", "Angry", "Tired"], correct: "Happy", explanation: "'Happy' = heureux/heureuse, 'Sad' = triste" },
                            { question: "Complète : 'She ___ a book.' (lire)", options: ["read", "reads", "reading", "readed"], correct: "reads", explanation: "Avec She, on ajoute -s au verbe : She reads = Elle lit" }
                        ],
                        numbers: [
                            { question: "How do you say '5'?", options: ["five", "fife", "fiv", "fyve"], correct: "five", explanation: "5 = five" },
                            { question: "How do you say '13'?", options: ["thirteen", "threeteen", "thirtheen", "therteen"], correct: "thirteen", explanation: "13 = thirteen" },
                            { question: "How do you say '20'?", options: ["twenty", "twenti", "twentty", "tuenty"], correct: "twenty", explanation: "20 = twenty" },
                            { question: "What time is it? (3:00)", options: ["three o'clock", "three hours", "three times", "third o'clock"], correct: "three o'clock", explanation: "o'clock = precise hour" },

                    shuffleArray(array) {
                        const shuffled = [...array];
                        for (let i = shuffled.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                        }
                        return shuffled;
                    },

                    selectTheme(t) {
                        this.currentTheme = t;
                        this.showQuiz = this.showResults = this.showIllustration = this.showLesson = false;
                    },

                    getThemeName() { return this.themes[this.currentTheme]?.name || ''; },
                    getThemeDescription() { return this.themes[this.currentTheme]?.description || ''; },
                    getImageUrl() { return this.themes[this.currentTheme]?.imageUrl || ''; },
                    getLessonTitle() { return this.lessonData[this.currentTheme]?.title || ''; },
                    getLessonContent() { return this.lessonData[this.currentTheme]?.content || ''; },
                    toggleIllustration() { this.showIllustration = !this.showIllustration; },

                    canStartQuiz(theme) {
                        const data = JSON.parse(localStorage.getItem(`quiz_cooldown_anglais_${theme}`) || '{}');
                        if (!data.lastCompleted) return true;
                        return (Date.now() - data.lastCompleted) >= 24 * 60 * 60 * 1000;
                    },

                    getCooldownTimeRemaining(theme) {
                        const data = JSON.parse(localStorage.getItem(`quiz_cooldown_anglais_${theme}`) || '{}');
                        if (!data.lastCompleted) return null;
                        const remaining = (24 * 60 * 60 * 1000) - (Date.now() - data.lastCompleted);
                        if (remaining <= 0) return null;
                        return { hours: Math.floor(remaining / 3600000), minutes: Math.floor((remaining % 3600000) / 60000) };
                    },

                    recordQuizCompletion(theme) {
                        const key = `quiz_cooldown_anglais_${theme}`;
                        const prev = JSON.parse(localStorage.getItem(key) || '{}');
                        localStorage.setItem(key, JSON.stringify({ lastCompleted: Date.now(), count: (prev.count || 0) + 1 }));
                    },

                    startQuiz() {
                        if (!this.canStartQuiz(this.currentTheme)) {
                            const remaining = this.getCooldownTimeRemaining(this.currentTheme);
                            const message = `⏰ Quiz déjà complété aujourd'hui !\n\nReviens dans ${remaining.hours}h ${remaining.minutes}min pour le refaire.`;
                            if (window.curioBubbleInstance) window.curioBubbleInstance.show(message, 'info');
                            else alert(message);
                            return;
                        }
                        // Mélange aléatoire : ordre des questions ET options de chaque question
                        const quiz = this.quizQuestions[this.currentTheme] || [];
                        const shuffledOrder = [...quiz].sort(() => Math.random() - 0.5);
                        this.shuffledQuiz = shuffledOrder.map(q => ({
                            ...q,
                            options: this.shuffleArray([...q.options])
                        }));
                        this.showQuiz = true;
                        this.showResults = false;
                        this.currentQuestionIndex = this.score = 0;
                        this.answered = false;
                        this.quizFinished = false;
                        this.loadQuestion();
                    },

                    getCurrentQuiz() {
                        // Pendant le quiz, retourne le tableau mélangé pour un ordre cohérent
                        if (this.showQuiz && this.shuffledQuiz) return this.shuffledQuiz;
                        return this.quizQuestions[this.currentTheme] || [];
                    },

                    loadQuestion() {
                        this.currentQuestion = this.getCurrentQuiz()[this.currentQuestionIndex];
                        this.answered = false;
                        this.isCorrect = false;
                    },

                    checkAnswer(selectedOption) {
                        if (this.answered) return;
                        this.answered = true;
                        this.isCorrect = (selectedOption === this.currentQuestion.correct);
                        if (this.isCorrect) {
                            this.score++;
                            this.playCorrectSound();
                            if (window.SectionXP) window.SectionXP.addXP('anglais', window.SectionXP.rewards.QUESTION_CORRECT);
                        } else {
                            this.playIncorrectSound();
                        }
                        setTimeout(() => { this.nextQuestion(); }, 2000);
                    },

                    nextQuestion() {
                        if (this.currentQuestionIndex < this.getCurrentQuiz().length - 1) {
                            this.currentQuestionIndex++;
                            this.loadQuestion();
                        } else {
                            this.finishQuiz();
                        }
                    },

                    finishQuiz() {
                        this.quizFinished = true;
                        const quizLength = this.getCurrentQuiz().length;
                        const isPerfect = (this.score === quizLength);

                        if (window.SectionXP) {
                            window.SectionXP.addXP('anglais', window.SectionXP.rewards.QUIZ_COMPLETED);
                            if (isPerfect) window.SectionXP.addXP('anglais', window.SectionXP.rewards.PERFECT_QUIZ);
                        }

                        try {
                            const raw = localStorage.getItem('lemondedescurieux_quiz_stats');
                            const stats = raw ? JSON.parse(raw) : { totalCompleted: 0, perfectCount: 0, bySubject: {} };
                            stats.totalCompleted = (stats.totalCompleted || 0) + 1;
                            if (isPerfect) stats.perfectCount = (stats.perfectCount || 0) + 1;
                            if (!stats.bySubject) stats.bySubject = {};
                            stats.bySubject.anglais = (stats.bySubject.anglais || 0) + 1;
                            localStorage.setItem('lemondedescurieux_quiz_stats', JSON.stringify(stats));
                        } catch(e) { console.warn('[anglais] Erreur stats quiz:', e); }

                        if (window.badgeSystem) {
                            const newBadges = window.badgeSystem.checkBadges();
                            if (newBadges && newBadges.length > 0 && window.curioBubbleInstance && newBadges[0]) {
                                window.curioBubbleInstance.show('🏆 Badge débloqué : ' + newBadges[0].name + ' !', 'success');
                            }
                            if (window.BRIDGE) window.BRIDGE.syncBadges();
                        }

                        this.recordQuizCompletion(this.currentTheme);
                    },

                    retryQuiz() {
                        if (!this.canStartQuiz(this.currentTheme)) {
                            const remaining = this.getCooldownTimeRemaining(this.currentTheme);
                            const message = `⏰ Quiz déjà complété aujourd'hui !\n\nReviens dans ${remaining.hours}h ${remaining.minutes}min pour le refaire.`;
                            if (window.curioBubbleInstance) window.curioBubbleInstance.show(message, 'info');
                            else alert(message);
                            this.backToTheme();
                            return;
                        }
                        // Re-mélange pour un nouvel ordre à chaque retry
                        const quiz = this.quizQuestions[this.currentTheme] || [];
                        const shuffledOrder = [...quiz].sort(() => Math.random() - 0.5);
                        this.shuffledQuiz = shuffledOrder.map(q => ({
                            ...q,
                            options: this.shuffleArray([...q.options])
                        }));
                        this.quizFinished = false;
                        this.currentQuestionIndex = this.score = 0;
                        this.loadQuestion();
                    },

                    getScoreMessage() {
                        const percentage = (this.score / this.getCurrentQuiz().length) * 100;
                        if (percentage === 100) return '🏆 Perfect! You mastered this theme!';
                        if (percentage >= 80) return '🌟 Excellent! Very well done!';
                        if (percentage >= 60) return '👍 Good job! Keep it up!';
                        if (percentage >= 40) return '💪 Not bad! Practice a bit more!';
                        return '📚 Keep learning, you\'ll get there!';
                    },

                    backToTheme() { this.showResults = false; this.showQuiz = false; }
                }));
            });
        </script>
