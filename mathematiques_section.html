<!DOCTYPE html>
<html lang="fr">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mathématiques - Le Monde des Curieux</title>

        <link rel="stylesheet" href="styles/mathematiques_alpine_COMPLETE.css">
    </head>

    <body x-data="mathApp" x-cloak>

        <!-- Système XP -->
        <script src="scripts/section-xp-system.js"></script>
        <script src="scripts/badges-system.js"></script>
        <script src="scripts/storage-bridge.js"></script>

        <!-- Bulle Curio -->
        <div x-data="curioBubble" x-show="visible" x-transition :class="'curio-bubble ' + variant">
            <button @click="hide()" class="curio-close">×</button>
            <div class="curio-avatar">🦊</div>
            <p class="curio-message" x-text="currentMessage"></p>
        </div>

        <div class="mathematiques-container">
            <!-- Header avec bouton retour -->
            <div class="section-header">
                <button onclick="window.location.href='index.html'" class="back-btn">
                    ← Retour à l'accueil
                </button>
            </div>

            <!-- Titre section -->
            <div class="section-title">
                <h1>🧮 Mathématiques</h1>
                <p>Explore les nombres, les formes et résous des problèmes passionnants !</p>
            </div>

            <!-- Navigation domaines -->
            <div class="domains-nav">
                <button @click="selectDomain('numeration')"
                    :class="'domain-btn numeration' + (currentDomain === 'numeration' ? ' active' : '')">
                    🔢 Numération
                </button>
                <button @click="selectDomain('calcul')"
                    :class="'domain-btn calcul' + (currentDomain === 'calcul' ? ' active' : '')">
                    ➕ Calcul
                </button>
                <button @click="selectDomain('geometrie')"
                    :class="'domain-btn geometrie' + (currentDomain === 'geometrie' ? ' active' : '')">
                    📐 Géométrie
                </button>
                <button @click="selectDomain('mesures')"
                    :class="'domain-btn mesures' + (currentDomain === 'mesures' ? ' active' : '')">
                    📊 Mesures
                </button>
                <button @click="selectDomain('problemes')"
                    :class="'domain-btn problemes' + (currentDomain === 'problemes' ? ' active' : '')">
                    🎲 Problèmes
                </button>
                <button @click="selectDomain('solides')"
                    :class="'domain-btn solides' + (currentDomain === 'solides' ? ' active' : '')">
                    📦 Solides
                </button>
                <button @click="selectDomain('proportionnalite')"
                    :class="'domain-btn proportionnalite' + (currentDomain === 'proportionnalite' ? ' active' : '')">
                    🔄 Proportionnalité
                </button>
                <button @click="selectDomain('donnees')"
                    :class="'domain-btn donnees' + (currentDomain === 'donnees' ? ' active' : '')">
                    📊 Données
                </button>
                <button @click="selectDomain('calcul_litteral')"
                    :class="'domain-btn calcul_litteral' + (currentDomain === 'calcul_litteral' ? ' active' : '')">
                    ⚡ Calcul littéral
                </button>
                <button @click="selectDomain('problemes_complexes')"
                    :class="'domain-btn problemes_complexes' + (currentDomain === 'problemes_complexes' ? ' active' : '')">
                    🎯 Problèmes complexes
                </button>
                <button @click="selectDomain('fractions')"
                    :class="'domain-btn fractions' + (currentDomain === 'fractions' ? ' active' : '')">
                    🍕 Fractions
                </button>
            </div>

            <!-- Contenu domaine -->
            <div class="domain-content" x-show="currentDomain" x-cloak>
                <div class="domain-section">
                    <h2 x-text="getDomainName()"></h2>
                    <p class="domain-description" x-text="getDomainDescription()"></p>
                </div>

                <!-- Boutons d'action -->
                <div class="action-buttons">
                    <button @click="toggleIllustration()" class="action-btn btn-visual">
                        🖼️ Voir l'illustration
                    </button>
                    <button @click="showLesson = !showLesson" class="action-btn btn-info">
                        📖 En savoir plus
                    </button>
                    <button @click="startQuiz()" class="action-btn btn-quiz">
                        🎯 Quiz
                    </button>
                </div>
            </div>

            <!-- EN SAVOIR PLUS - CONTENU ÉDUCATIF -->
            <div x-show="showLesson" x-transition class="lesson-container">
                <div class="lesson-header">
                    <h3>📖 <span x-text="getLessonTitle()"></span></h3>
                    <button @click="showLesson = false" class="close-btn">Fermer</button>
                </div>
                <div class="lesson-content" x-html="getLessonContent()"></div>
            </div>

            <!-- ILLUSTRATION -->
            <div x-show="showIllustration" x-transition class="illustration-container">
                <div class="illustration-header">
                    <h3>🖼️ <span x-text="getDomainName()"></span></h3>
                    <button @click="showIllustration = false" class="close-btn">Fermer</button>
                </div>
                <div class="illustration-content">
                    <img :src="getImageUrl()" :alt="'Illustration ' + getDomainName()" class="domain-illustration" loading="lazy">
                </div>
            </div>
        </div>

        <!-- QUIZ -->
        <div x-show="showQuiz" x-transition class="quiz-container">
            <div class="quiz-header">
                <h3>🎯 Quiz <span x-text="getDomainName()"></span></h3>
                <div class="quiz-progress">
                    <p>Question <span x-text="currentQuestionIndex + 1"></span> / <span x-text="getCurrentQuiz().length"></span></p>
                    <div class="progress-bar">
                        <div class="progress-fill" :style="'width: ' + ((currentQuestionIndex + 1) / getCurrentQuiz().length * 100) + '%'"></div>
                    </div>
                </div>
            </div>

            <div class="quiz-content">
                <div x-show="!quizFinished" class="question-zone">
                    <div class="question-text">
                        <span x-text="currentQuestion.question"></span>
                    </div>

                    <!-- Options de réponse -->
                    <div class="answer-options">
                        <template x-for="(option, index) in currentQuestion.options" :key="index">
                            <button @click="checkAnswer(option)" class="answer-btn" :disabled="answered" x-text="option">
                            </button>
                        </template>
                    </div>

                    <!-- Feedback -->
                    <div x-show="answered" x-transition class="feedback-zone">
                        <div :class="'feedback ' + (isCorrect ? 'correct' : 'incorrect')">
                            <span x-show="isCorrect">✅ Bravo ! C'est correct !</span>
                            <span x-show="!isCorrect">
                                ❌ Pas tout à fait... La bonne réponse était : <strong x-text="currentQuestion.correct"></strong>
                            </span>
                        </div>
                        <div class="feedback-explanation" x-show="currentQuestion.explanation">
                            💡 <span x-text="currentQuestion.explanation"></span>
                        </div>
                        <!-- Bouton "Suivant" supprimé : auto-avance après 2s -->
                    </div>
                </div>

                <!-- Résultats finaux -->
                <div x-show="quizFinished" x-transition class="results-zone">
                    <h3>🎉 Quiz terminé !</h3>
                    <div class="score-display">
                        <div class="score-circle">
                            <span class="score-number" x-text="score"></span>
                            <span class="score-total" x-text="'/ ' + getCurrentQuiz().length"></span>
                        </div>
                        <p class="score-percentage" x-text="Math.round((score / getCurrentQuiz().length) * 100) + '%'"></p>
                        <p class="score-message" x-text="getScoreMessage()"></p>
                    </div>
                    <div class="results-actions">
                        <button @click="retryQuiz()" class="action-btn btn-quiz">
                            🔄 Recommencer
                        </button>
                        <button @click="backToDomain()" class="action-btn btn-info">
                            ← Retour au domaine
                        </button>
                    </div>
                </div>
            </div>
        </div>

        </div>

        <!-- Alpine.js CDN -->
        <script src="scripts/data/maths-quiz.js"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

        <!-- JS inline AVANT Alpine -->
        <script>
            document.addEventListener('alpine:init', () => {
                console.log('🎯 Alpine:init déclenché');

                Alpine.data('curioBubble', () => ({
                    visible: false,
                    currentMessage: '',
                    variant: 'info',
                    autoHideTimer: null,
                    init() { window.curioBubbleInstance = this; },
                    show(m, v = 'info') {
                        if (this.autoHideTimer) clearTimeout(this.autoHideTimer);
                        this.currentMessage = m;
                        this.variant = v;
                        this.visible = true;
                        this.autoHideTimer = setTimeout(() => this.hide(), 5000);
                    },
                    hide() { this.visible = false; }
                }));

                Alpine.data('mathApp', () => ({
                    currentDomain: 'numeration',
                    showIllustration: false,
                    showLesson: false,
                    showQuiz: false,
                    showResults: false,
                    currentQuestionIndex: 0,
                    score: 0,
                    selectedAnswer: null,
                    answered: false,
                    isCorrect: false,
                    quizFinished: false,
                    currentQuestion: null,
                    audioContext: null,

                    init() {
                        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        console.log('✅ mathApp initialisé');

                        // Initialiser le système XP
                        if (window.SectionXP) {
                            window.SectionXP.init('maths');
                        }
                    },

                    playCorrectSound() {
                        try {
                            const o = this.audioContext.createOscillator(), g = this.audioContext.createGain();
                            o.connect(g); g.connect(this.audioContext.destination);
                            o.frequency.value = 523; o.type = 'sine';
                            g.gain.setValueAtTime(0.3, this.audioContext.currentTime);
                            g.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.2);
                            o.start(); o.stop(this.audioContext.currentTime + 0.2);
                        } catch (e) { }
                    },

                    playIncorrectSound() {
                        try {
                            const o = this.audioContext.createOscillator(), g = this.audioContext.createGain();
                            o.connect(g); g.connect(this.audioContext.destination);
                            o.frequency.value = 185; o.type = 'triangle';
                            g.gain.setValueAtTime(0.3, this.audioContext.currentTime);
                            g.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.3);
                            o.start(); o.stop(this.audioContext.currentTime + 0.3);
                        } catch (e) { }
                    },

                    domains: {
                        numeration: {
                            name: 'Numération',
                            description: 'Découvre les nombres, les fractions et les décimaux',
                            imageUrl: '/images/mathematiques/illustration_numeration.jpg'
                        },
                        calcul: {
                            name: 'Calcul',
                            description: 'Maîtrise l\'addition, la soustraction, la multiplication et la division',
                            imageUrl: '/images/mathematiques/illustration_calcul.jpg'
                        },
                        geometrie: {
                            name: 'Géométrie',
                            description: 'Explore les formes, les figures et l\'espace',
                            imageUrl: '/images/mathematiques/illustration_geometrie.jpg'
                        },
                        mesures: {
                            name: 'Mesures',
                            description: 'Apprends à mesurer les longueurs, les masses et le temps',
                            imageUrl: '/images/mathematiques/illustration_mesures.jpg'
                        },
                        problemes: {
                            name: 'Problèmes',
                            description: 'Résous des problèmes mathématiques de la vie quotidienne',
                            imageUrl: '/images/mathematiques/illustration_problemes.jpg'
                        },
                        solides: {
                            name: 'Solides et volumes',
                            description: 'Découvre les formes 3D et calcule des volumes',
                            imageUrl: '/images/mathematiques/illustration_solides.jpg'
                        },
                        proportionnalite: {
                            name: 'Proportionnalité',
                            description: 'Maîtrise les tableaux de proportionnalité',
                            imageUrl: '/images/mathematiques/illustration_proportionnalite.jpg'
                        },
                        donnees: {
                            name: 'Données',
                            description: 'Lis et interprète les graphiques et tableaux',
                            imageUrl: '/images/mathematiques/illustration_donnees.jpg'
                        },
                        calcul_litteral: {
                            name: 'Calcul littéral',
                            description: 'Initiation aux expressions avec des lettres',
                            imageUrl: '/images/mathematiques/illustration_calcul_litteral.jpg'
                        },
                        problemes_complexes: {
                            name: 'Problèmes complexes',
                            description: 'Résous des problèmes à plusieurs étapes',
                            imageUrl: '/images/mathematiques/illustration_problemes_complexes.jpg'
                        },
                        fractions: {
                            name: 'Fractions',
                            description: 'Comprends et manipule les fractions pas à pas',
                            imageUrl: '/images/mathematiques/illustration_fractions.jpg'
                        }
                    },

                    // Contenus pédagogiques
                    lessonData: {
                        numeration: {
                            title: "🔢 La Numération",
                            content: `
                                <h3>Qu'est-ce que la numération ?</h3>
                                <p>La numération, c'est l'art de <strong>compter, écrire et comprendre les nombres</strong>. En CM1-CM2, tu apprends à manipuler des nombres de plus en plus grands !</p>

                                <h3>Les grands nombres</h3>
                                <p>Tu connais déjà les unités (0-9), les dizaines (10, 20, 30...) et les centaines (100, 200, 300...). Maintenant, découvre :</p>
                                <ul>
                                    <li><strong>Les milliers</strong> : 1 000, 2 000, 10 000...</li>
                                    <li><strong>Les dizaines de milliers</strong> : 10 000, 20 000, 50 000...</li>
                                    <li><strong>Les centaines de milliers</strong> : 100 000, 500 000...</li>
                                    <li><strong>Les millions</strong> : 1 000 000 et au-delà !</li>
                                </ul>

                                <h3>Les fractions</h3>
                                <p>Une fraction représente une <strong>partie d'un tout</strong>. Par exemple :</p>
                                <ul>
                                    <li><strong>1/2</strong> (un demi) = la moitié d'un gâteau</li>
                                    <li><strong>1/4</strong> (un quart) = un quart de pizza</li>
                                    <li><strong>3/4</strong> (trois quarts) = trois parts sur quatre</li>
                                </ul>

                                <h3>Les nombres décimaux</h3>
                                <p>Un nombre décimal utilise une <strong>virgule</strong> pour séparer :</p>
                                <ul>
                                    <li>La <strong>partie entière</strong> (avant la virgule) : 12</li>
                                    <li>La <strong>partie décimale</strong> (après la virgule) : 0,5</li>
                                    <li>Exemple : <strong>12,5</strong> = douze et demi</li>
                                </ul>

                                <h3>À retenir</h3>
                                <p>📌 Chaque position d'un chiffre a une <strong>valeur</strong> : unités, dizaines, centaines, milliers...</p>
                                <p>📌 Les fractions et les décimaux permettent d'exprimer des nombres <strong>entre les entiers</strong> !</p>
                            `
                        },
                        calcul: {
                            title: "➕ Le Calcul",
                            content: `
                                <h3>Qu'est-ce que le calcul ?</h3>
                                <p>Le calcul, c'est l'ensemble des <strong>opérations mathématiques</strong> qui te permettent de résoudre des problèmes : addition, soustraction, multiplication et division !</p>

                                <h3>L'addition (+)</h3>
                                <p>Additionner, c'est <strong>ajouter</strong> des quantités :</p>
                                <ul>
                                    <li>Exemple : <strong>23 + 47 = 70</strong></li>
                                    <li>Astuce : Pose l'opération en colonnes (unités sous unités, dizaines sous dizaines)</li>
                                </ul>

                                <h3>La soustraction (−)</h3>
                                <p>Soustraire, c'est <strong>retirer</strong> une quantité :</p>
                                <ul>
                                    <li>Exemple : <strong>85 − 32 = 53</strong></li>
                                    <li>Attention aux <strong>retenues</strong> quand il faut emprunter !</li>
                                </ul>

                                <h3>La multiplication (×)</h3>
                                <p>Multiplier, c'est faire une <strong>addition répétée</strong> :</p>
                                <ul>
                                    <li>Exemple : <strong>6 × 7 = 42</strong> (6 fois le nombre 7)</li>
                                    <li>Apprends tes <strong>tables de multiplication</strong> jusqu'à 10 !</li>
                                    <li>Multiplication à 2 chiffres : <strong>24 × 13 = 312</strong></li>
                                </ul>

                                <h3>La division (÷)</h3>
                                <p>Diviser, c'est <strong>partager équitablement</strong> :</p>
                                <ul>
                                    <li>Exemple : <strong>20 ÷ 4 = 5</strong> (20 partagé en 4 parts égales)</li>
                                    <li>La <strong>division euclidienne</strong> : 23 ÷ 5 = 4 (reste 3)</li>
                                </ul>

                                <h3>Le calcul mental</h3>
                                <p>Entraîne-toi à calculer <strong>rapidement de tête</strong> :</p>
                                <ul>
                                    <li>Additions/soustractions simples : 8 + 7 = 15</li>
                                    <li>Tables de multiplication : 7 × 8 = 56</li>
                                    <li>Doubles et moitiés : double de 15 = 30, moitié de 50 = 25</li>
                                </ul>

                                <h3>À retenir</h3>
                                <p>📌 Vérifie toujours tes calculs avec l'<strong>opération inverse</strong> !</p>
                                <p>📌 Le calcul mental te fait gagner du temps et développe ton cerveau 🧠</p>
                            `
                        },
                        geometrie: {
                            title: "📐 La Géométrie",
                            content: `
                                <h3>Qu'est-ce que la géométrie ?</h3>
                                <p>La géométrie étudie les <strong>formes, les figures et l'espace</strong>. C'est la mathématique des formes que tu vois partout autour de toi !</p>

                                <h3>Les figures planes</h3>
                                <p>Une figure plane est une forme <strong>à deux dimensions</strong> (longueur et largeur) :</p>
                                <ul>
                                    <li><strong>Le carré</strong> : 4 côtés égaux, 4 angles droits</li>
                                    <li><strong>Le rectangle</strong> : 4 angles droits, côtés opposés égaux</li>
                                    <li><strong>Le triangle</strong> : 3 côtés, 3 angles</li>
                                    <li><strong>Le cercle</strong> : une ligne courbe fermée, tous les points sont à égale distance du centre</li>
                                </ul>

                                <h3>Le périmètre</h3>
                                <p>Le périmètre, c'est la <strong>longueur du contour</strong> d'une figure :</p>
                                <ul>
                                    <li>Carré : <strong>P = côté × 4</strong></li>
                                    <li>Rectangle : <strong>P = (longueur + largeur) × 2</strong></li>
                                    <li>Triangle : <strong>P = côté1 + côté2 + côté3</strong></li>
                                </ul>

                                <h3>L'aire</h3>
                                <p>L'aire, c'est la <strong>surface intérieure</strong> d'une figure (en cm², m²...) :</p>
                                <ul>
                                    <li>Carré : <strong>A = côté × côté</strong></li>
                                    <li>Rectangle : <strong>A = longueur × largeur</strong></li>
                                    <li>Triangle : <strong>A = (base × hauteur) ÷ 2</strong></li>
                                </ul>

                                <h3>La symétrie</h3>
                                <p>Une figure est <strong>symétrique</strong> quand on peut la plier en deux et que les deux parties se superposent parfaitement. La ligne de pliage s'appelle l'<strong>axe de symétrie</strong>.</p>

                                <h3>Les angles</h3>
                                <ul>
                                    <li><strong>Angle droit</strong> : 90° (comme le coin d'un carré)</li>
                                    <li><strong>Angle aigu</strong> : moins de 90°</li>
                                    <li><strong>Angle obtus</strong> : plus de 90° mais moins de 180°</li>
                                </ul>

                                <h3>À retenir</h3>
                                <p>📌 Utilise ta <strong>règle, ton équerre et ton compas</strong> pour tracer précisément !</p>
                                <p>📌 Le périmètre mesure le <strong>tour</strong>, l'aire mesure la <strong>surface</strong> 📏</p>
                            `
                        },
                        mesures: {
                            title: "📊 Les Mesures",
                            content: `
                                <h3>Qu'est-ce que mesurer ?</h3>
                                <p>Mesurer, c'est déterminer la <strong>quantité d'une grandeur</strong> : longueur, masse, contenance, temps...</p>

                                <h3>Les longueurs</h3>
                                <p>Pour mesurer des <strong>distances</strong> :</p>
                                <ul>
                                    <li><strong>Le millimètre (mm)</strong> : épaisseur d'une pièce</li>
                                    <li><strong>Le centimètre (cm)</strong> : largeur d'un doigt</li>
                                    <li><strong>Le mètre (m)</strong> : hauteur d'une porte</li>
                                    <li><strong>Le kilomètre (km)</strong> : distance entre deux villes</li>
                                </ul>
                                <p>📐 Conversions : 1 m = 100 cm = 1 000 mm | 1 km = 1 000 m</p>

                                <h3>Les masses</h3>
                                <p>Pour mesurer le <strong>poids</strong> des objets :</p>
                                <ul>
                                    <li><strong>Le gramme (g)</strong> : poids d'un bonbon</li>
                                    <li><strong>Le kilogramme (kg)</strong> : poids d'un sac de farine</li>
                                    <li><strong>La tonne (t)</strong> : poids d'une voiture</li>
                                </ul>
                                <p>⚖️ Conversions : 1 kg = 1 000 g | 1 t = 1 000 kg</p>

                                <h3>Les contenances</h3>
                                <p>Pour mesurer la <strong>quantité de liquide</strong> :</p>
                                <ul>
                                    <li><strong>Le centilitre (cL)</strong> : petite dose</li>
                                    <li><strong>Le litre (L)</strong> : bouteille d'eau</li>
                                </ul>
                                <p>🥛 Conversions : 1 L = 100 cL = 1 000 mL</p>

                                <h3>Le temps</h3>
                                <p>Pour mesurer la <strong>durée</strong> :</p>
                                <ul>
                                    <li><strong>La seconde (s)</strong> : un battement de cœur</li>
                                    <li><strong>La minute (min)</strong> : 60 secondes</li>
                                    <li><strong>L'heure (h)</strong> : 60 minutes</li>
                                    <li><strong>Le jour</strong> : 24 heures</li>
                                    <li><strong>La semaine</strong> : 7 jours</li>
                                    <li><strong>Le mois</strong> : environ 30 jours</li>
                                    <li><strong>L'année</strong> : 12 mois = 365 jours</li>
                                </ul>

                                <h3>Lire l'heure</h3>
                                <ul>
                                    <li>La <strong>petite aiguille</strong> indique les heures</li>
                                    <li>La <strong>grande aiguille</strong> indique les minutes</li>
                                    <li>Exemple : 14h30 = 2h30 de l'après-midi</li>
                                </ul>

                                <h3>À retenir</h3>
                                <p>📌 Pour convertir, utilise un <strong>tableau de conversion</strong> !</p>
                                <p>📌 Pense aux unités dans la vie quotidienne : cuisine, sport, voyages 🏃</p>
                            `
                        },
                        problemes: {
                            title: "🎲 Résolution de Problèmes",
                            content: `
                                <h3>Qu'est-ce qu'un problème mathématique ?</h3>
                                <p>Un problème mathématique est une <strong>situation de la vie réelle</strong> que tu résous en utilisant les mathématiques : calculs, logique et raisonnement !</p>

                                <h3>Les étapes pour résoudre un problème</h3>
                                <ol>
                                    <li><strong>Lis attentivement</strong> l'énoncé du problème</li>
                                    <li><strong>Identifie</strong> les données importantes (nombres, unités)</li>
                                    <li><strong>Cherche</strong> ce qu'on te demande de trouver</li>
                                    <li><strong>Choisis</strong> la ou les opérations nécessaires</li>
                                    <li><strong>Pose et effectue</strong> les calculs</li>
                                    <li><strong>Rédige</strong> une phrase-réponse complète</li>
                                    <li><strong>Vérifie</strong> que ta réponse a du sens</li>
                                </ol>

                                <h3>Les types de problèmes</h3>

                    getCooldownTimeRemaining(domain) {
                        const cooldownKey = `quiz_cooldown_maths_${domain}`;
                        const cooldownData = JSON.parse(localStorage.getItem(cooldownKey) || '{}');
                        if (!cooldownData.lastCompleted) return null;
                        const now = Date.now();
                        const timeSinceCompletion = now - cooldownData.lastCompleted;
                        const cooldownDuration = 24 * 60 * 60 * 1000;
                        const remaining = cooldownDuration - timeSinceCompletion;
                        if (remaining <= 0) return null;
                        const hours = Math.floor(remaining / (60 * 60 * 1000));
                        const minutes = Math.floor((remaining % (60 * 60 * 1000)) / (60 * 1000));
                        return { hours, minutes };
                    },

                    recordQuizCompletion(domain) {
                        const cooldownKey = `quiz_cooldown_maths_${domain}`;
                        const cooldownData = {
                            lastCompleted: Date.now(),
                            count: (JSON.parse(localStorage.getItem(cooldownKey) || '{}').count || 0) + 1
                        };
                        localStorage.setItem(cooldownKey, JSON.stringify(cooldownData));
                        console.log(`🔒 Cooldown activé pour ${domain}`);
                    },

                    startQuiz() {
                        // ✅ VÉRIFIER COOLDOWN
                        if (!this.canStartQuiz(this.currentDomain)) {
                            const remaining = this.getCooldownTimeRemaining(this.currentDomain);
                            const message = `⏰ Quiz déjà complété aujourd'hui !\n\nReviens dans ${remaining.hours}h ${remaining.minutes}min.`;
                            if (window.curioBubbleInstance) {
                                window.curioBubbleInstance.show(message, 'info');
                            } else {
                                alert(message);
                            }
                            return;
                        }

                        this.showQuiz = true;
                        this.showResults = false;
                        this.currentQuestionIndex = this.score = 0;
                        this.selectedAnswer = null;
                        this.answered = false;
                        this.quizFinished = false;
                        this.loadQuestion();
                    },

                    getCurrentQuiz() {
                        if (typeof mathsQuiz !== 'undefined') {
                            return mathsQuiz[this.currentDomain] || [];
                        }
                        return [];
                    },

                    loadQuestion() {
                        const questions = this.getCurrentQuiz();
                        this.currentQuestion = questions[this.currentQuestionIndex];
                        this.answered = false;
                        this.isCorrect = false;
                    },

                    checkAnswer(selectedOption) {
                        if (this.answered) return;
                        this.answered = true;
                        this.isCorrect = (selectedOption === this.currentQuestion.correct);
                        if (this.isCorrect) {
                            this.score++;
                            this.playCorrectSound();

                            // Ajouter XP pour bonne réponse
                            if (window.SectionXP) {
                                window.SectionXP.addXP('maths', window.SectionXP.rewards.QUESTION_CORRECT);
                            }
                        } else {
                            this.playIncorrectSound();
                        }

                        // ✅ AUTO-AVANCE : Timer 2 secondes puis question suivante
                        setTimeout(() => {
                            this.nextQuestion();
                        }, 2000);
                    },

                    nextQuestion() {
                        if (this.currentQuestionIndex < this.getCurrentQuiz().length - 1) {
                            this.currentQuestionIndex++;
                            this.loadQuestion();
                        } else {
                            this.finishQuiz();
                        }
                    },

                    finishQuiz() {
                        this.quizFinished = true;

                        // Bonus XP pour complétion du quiz
                        if (window.SectionXP) {
                            window.SectionXP.addXP('maths', window.SectionXP.rewards.QUIZ_COMPLETED);

                            // Bonus supplémentaire si quiz parfait
                            const quizLength = this.getCurrentQuiz().length;
                            if (this.score === quizLength) {
                                window.SectionXP.addXP('maths', window.SectionXP.rewards.PERFECT_QUIZ);
                            }
                        }


                        // ========================================================================
                        // NOUVEAU : MasterGameSystem v3.0
                        // ========================================================================
                        if (typeof gameSystem !== 'undefined') {
                            try {
                                const quizLength = this.getCurrentQuiz().length;
                                const percentage = Math.round((this.score / quizLength) * 100);
                                const baseXP = this.score * 10;
                                const lessonId = `maths_${this.currentDomain}_${Date.now()}`;

                                // Context pour bonus
                                const mathsData = gameSystem.getSectionData('maths');
                                const context = {
                                    perfectScore: percentage === 100,
                                    hasActiveStreak: mathsData.streak > 0
                                };

                                // Attribution XP avec bonus automatiques
                                const earnedXP = gameSystem.awardXP('maths', baseXP, context);

                                // Enregistrer complétion leçon
                                gameSystem.completeLesson('maths', lessonId, percentage, 0);

                                // Mettre à jour streak quotidien
                                gameSystem.updateStreak('maths');

                                // Mettre à jour affichage badges
                                if (typeof updateGameSystemUI === 'function') {
                                    updateGameSystemUI();
                                }

                                console.log(`✅ MasterGameSystem: +${earnedXP} XP (base: ${baseXP}, score: ${percentage}%)`);

                            } catch (error) {
                                console.error('❌ Erreur MasterGameSystem:', error);
                            }
                        }
                        // ========================================================================

                        // ✅ ENREGISTRER COOLDOWN (24h)
                        this.recordQuizCompletion(this.currentDomain);
                    },

                    retryQuiz() {
                        // ✅ VÉRIFIER COOLDOWN même pour retry
                        if (!this.canStartQuiz(this.currentDomain)) {
                            const remaining = this.getCooldownTimeRemaining(this.currentDomain);
                            const message = `⏰ Quiz déjà complété aujourd'hui !\n\nReviens dans ${remaining.hours}h ${remaining.minutes}min.`;
                            if (window.curioBubbleInstance) {
                                window.curioBubbleInstance.show(message, 'info');
                            } else {
                                alert(message);
                            }
                            this.backToDomain();
                            return;
                        }

                        this.quizFinished = false;
                        this.currentQuestionIndex = this.score = 0;
                        this.loadQuestion();
                    },

                    getScoreMessage() {
                        const percentage = (this.score / this.getCurrentQuiz().length) * 100;
                        if (percentage === 100) return '🏆 Parfait ! Tu maîtrises ce domaine !';
                        if (percentage >= 80) return '🌟 Excellent ! Très bien joué !';
                        if (percentage >= 60) return '👍 Bien ! Continue comme ça !';
                        if (percentage >= 40) return '💪 Pas mal ! Révise encore un peu !';
                        return '📚 Continue à apprendre, tu vas y arriver !';
                    },

                    backToDomain() {
                        this.showResults = false;
                        this.showQuiz = false;
                    }
                }));
            });
        </script>
