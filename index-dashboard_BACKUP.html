<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Monde des Curieux - Dashboard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Lexend:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles/curio-main.css">
    <link rel="stylesheet" href="styles/dashboard-home.css">
</head>
<body class="minecraft-theme dashboard-home">
    <div class="container">
        
        <!-- ✅ BOUTON RETOUR -->
        <div style="margin-bottom: 20px;">
            <button onclick="location.href='index.html'" style="font-family: 'Press Start 2P'; font-size: 10px; padding: 10px 20px; background: #e74c3c; color: white; border: 3px solid #000; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.3);">
                ← RETOUR ACCUEIL
            </button>
        </div>
        
        <header class="main-header">
            <div class="logo-section">
                <h1 class="main-title">MON PARCOURS</h1>
                <p class="subtitle">Explorateur : <span id="player-name">Curieux</span></p>
            </div>
            <div class="global-stats">
                <div class="stat-card">
                    <span class="stat-icon">💎</span>
                    <div class="stat-info">
                        <span class="stat-value" id="total-xp">0</span>
                        <span class="stat-label">TOTAL XP</span>
                    </div>
                </div>
                <div class="stat-card">
                    <span class="stat-icon">🏆</span>
                    <div class="stat-info">
                        <span class="stat-value" id="current-level">1</span>
                        <span class="stat-label">NIVEAU</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- ✅ DEBUG ZONE -->
        <div id="debug-zone" style="background: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-family: monospace; font-size: 11px;">
            <strong>🔍 DEBUG:</strong><br>
            <span id="debug-info">Initialisation...</span>
        </div>

        <main class="sections-grid">
            <div class="section-card francais" onclick="location.href='francais_duolingo_section.html'">
                <span class="section-emoji">📚</span>
                <h2 class="section-title">FRANÇAIS</h2>
                <div class="progress-container"><div id="francais-bar" class="progress-bar"></div></div>
                <div id="francais-xp-display" class="xp-badge-small">0 XP</div>
            </div>

            <div class="section-card maths" onclick="location.href='maths_duolingo_section.html'">
                <span class="section-emoji">🔢</span>
                <h2 class="section-title">MATHS</h2>
                <div class="progress-container"><div id="maths-bar" class="progress-bar"></div></div>
                <div id="maths-xp-display" class="xp-badge-small">0 XP</div>
            </div>

            <div class="section-card english" onclick="location.href='english_duolingo_section.html'">
                <span class="section-emoji">🇬🇧</span>
                <h2 class="section-title">ENGLISH</h2>
                <div class="progress-container"><div id="english-bar" class="progress-bar"></div></div>
                <div id="english-xp-display" class="xp-badge-small">0 XP</div>
            </div>

            <div class="section-card histoire" onclick="location.href='histoire_duolingo_section.html'">
                <span class="section-emoji">🏰</span>
                <h2 class="section-title">HISTOIRE</h2>
                <div class="progress-container"><div id="histoire-bar" class="progress-bar"></div></div>
                <div id="histoire-xp-display" class="xp-badge-small">0 XP</div>
            </div>

            <div class="section-card sciences" onclick="location.href='sciences_duolingo_section.html'">
                <span class="section-emoji">🧪</span>
                <h2 class="section-title">SCIENCES</h2>
                <div class="progress-container"><div id="sciences-bar" class="progress-bar"></div></div>
                <div id="sciences-xp-display" class="xp-badge-small">0 XP</div>
            </div>
        </main>

        <!-- ✅ BOUTONS TEST -->
        <div style="margin-top: 30px; text-align: center;">
            <button onclick="testAddXP()" style="font-family: 'Press Start 2P'; font-size: 9px; padding: 10px; background: #27ae60; color: white; border: 2px solid #000; border-radius: 5px; cursor: pointer; margin: 5px;">
                🧪 TEST +50 XP FRANÇAIS
            </button>
            <button onclick="showAllData()" style="font-family: 'Press Start 2P'; font-size: 9px; padding: 10px; background: #3498db; color: white; border: 2px solid #000; border-radius: 5px; cursor: pointer; margin: 5px;">
                📊 VOIR DONNÉES
            </button>
            <button onclick="resetAllXP()" style="font-family: 'Press Start 2P'; font-size: 9px; padding: 10px; background: #e74c3c; color: white; border: 2px solid #000; border-radius: 5px; cursor: pointer; margin: 5px;">
                🗑️ RESET TOUT
            </button>
        </div>
    </div>

    <!-- ✅✅✅ SYSTÈME XP INTÉGRÉ DIRECTEMENT ✅✅✅ -->
    <script>
        (function() {
            'use strict';

            console.log('🚀 Initialisation système XP autonome...');

            // ========================================
            // CLASSE XP SYSTEM COMPLÈTE
            // ========================================
            class UnifiedXPSystem {
                constructor() {
                    this.storageKey = 'lemondedescurieux_xp';
                    this.sections = ['francais', 'maths', 'anglais', 'sciences', 'histoire'];
                    this.data = this.loadData();
                    this.migrateOldData();
                    console.log('✅ UnifiedXPSystem créé', this.data);
                }

                loadData() {
                    try {
                        const saved = localStorage.getItem(this.storageKey);
                        if (saved) {
                            return JSON.parse(saved);
                        }
                    } catch (e) {
                        console.error('Erreur chargement:', e);
                    }
                    return this.getDefaultData();
                }

                getDefaultData() {
                    const bySection = {};
                    this.sections.forEach(s => { bySection[s] = 0; });
                    return {
                        total: 0,
                        bySection: bySection,
                        level: 1,
                        xpToNextLevel: 200,
                        history: [],
                        lastActivity: null
                    };
                }

                saveData() {
                    try {
                        localStorage.setItem(this.storageKey, JSON.stringify(this.data));
                        console.log('💾 Sauvegardé:', this.data.total, 'XP');
                        return true;
                    } catch (e) {
                        console.error('Erreur sauvegarde:', e);
                        return false;
                    }
                }

                migrateOldData() {
                    const oldXP = parseInt(localStorage.getItem('curio_xp') || '0');
                    if (oldXP > 0 && this.data.total === 0) {
                        console.log('🔄 Migration:', oldXP, 'XP');
                        this.data.bySection.francais = oldXP;
                        this.data.total = oldXP;
                        this.recalculateLevel();
                        this.saveData();
                    }
                }

                addXP(section, amount, metadata = {}) {
                    if (!this.sections.includes(section)) {
                        console.warn('⚠️ Section inconnue:', section);
                        return false;
                    }

                    const xpToAdd = Math.max(0, parseInt(amount) || 0);
                    if (xpToAdd === 0) return false;

                    const previousLevel = this.data.level;

                    this.data.bySection[section] += xpToAdd;
                    this.data.total += xpToAdd;
                    this.data.lastActivity = new Date().toISOString();

                    this.addToHistory(section, xpToAdd, metadata);
                    this.recalculateLevel();
                    this.saveData();

                    window.dispatchEvent(new CustomEvent('xp:updated', {
                        detail: { section, amount: xpToAdd, total: this.data.total, level: this.data.level }
                    }));

                    if (this.data.level > previousLevel) {
                        window.dispatchEvent(new CustomEvent('xp:levelup', {
                            detail: { level: this.data.level, previousLevel }
                        }));
                        alert(`🎉 NIVEAU ${this.data.level} ATTEINT !`);
                    }

                    console.log(`✅ +${xpToAdd} XP (${section}) | Total: ${this.data.total} | Niv.${this.data.level}`);
                    return true;
                }

                recalculateLevel() {
                    let level = 1;
                    let totalNeeded = 0;
                    const baseXP = 200;
                    const multiplier = 1.5;

                    while (totalNeeded <= this.data.total) {
                        const xpForLevel = Math.floor(baseXP * Math.pow(multiplier, level - 1));
                        totalNeeded += xpForLevel;
                        if (totalNeeded <= this.data.total) level++;
                    }

                    this.data.level = level;
                    this.data.xpToNextLevel = Math.floor(baseXP * Math.pow(multiplier, level - 1));
                }

                addToHistory(section, xp, metadata) {
                    this.data.history.unshift({
                        section, xp,
                        timestamp: new Date().toISOString(),
                        ...metadata
                    });
                    if (this.data.history.length > 100) {
                        this.data.history = this.data.history.slice(0, 100);
                    }
                }

                getTotal() { return this.data.total; }
                getLevel() { return this.data.level; }
                getBySection(section) { return this.data.bySection[section] || 0; }
                getAllSections() { return { ...this.data.bySection }; }
                getStats() {
                    return {
                        totalXP: this.data.total,
                        level: this.data.level,
                        xpToNext: this.data.xpToNextLevel,
                        sections: this.getAllSections(),
                        historyCount: this.data.history.length
                    };
                }

                reset() {
                    this.data = this.getDefaultData();
                    this.saveData();
                    localStorage.removeItem('curio_xp');
                    console.log('🔄 XP réinitialisés');
                    window.dispatchEvent(new CustomEvent('xp:reset', {}));
                    return true;
                }
            }

            // Créer instance globale
            window.xpSystem = new UnifiedXPSystem();
            console.log('✅ window.xpSystem disponible');

            // ========================================
            // INITIALISATION DASHBOARD
            // ========================================
            document.addEventListener('DOMContentLoaded', () => {
                const debugInfo = document.getElementById('debug-info');

                // Afficher debug
                const stats = window.xpSystem.getStats();
                debugInfo.innerHTML = `
                    ✅ Système XP chargé<br>
                    Total XP: ${stats.totalXP}<br>
                    Niveau: ${stats.level}<br>
                    Sections: ${JSON.stringify(stats.sections)}<br>
                    <span style="color: #2ecc71;">Prêt à l'emploi !</span>
                `;

                const sections = [
                    { id: 'francais', htmlId: 'francais' },
                    { id: 'maths', htmlId: 'maths' },
                    { id: 'anglais', htmlId: 'english' },
                    { id: 'histoire', htmlId: 'histoire' },
                    { id: 'sciences', htmlId: 'sciences' }
                ];

                function updateDashboard() {
                    const totalXP = window.xpSystem.getTotal();
                    const level = window.xpSystem.getLevel();

                    document.getElementById('total-xp').textContent = totalXP;
                    document.getElementById('current-level').textContent = level;

                    const allXP = window.xpSystem.getAllSections();

                    sections.forEach(section => {
                        const xp = allXP[section.id] || 0;
                        
                        const xpDisplay = document.getElementById(`${section.htmlId}-xp-display`);
                        const barDisplay = document.getElementById(`${section.htmlId}-bar`);
                        
                        if (xpDisplay) xpDisplay.textContent = `${xp} XP`;
                        if (barDisplay) {
                            const percentage = Math.min((xp / 500) * 100, 100);
                            barDisplay.style.width = `${percentage}%`;
                        }
                    });

                    console.log('🔄 Dashboard mis à jour:', totalXP, 'XP');
                }

                // Mise à jour initiale
                updateDashboard();

                // Écouter events
                window.addEventListener('xp:updated', updateDashboard);
                window.addEventListener('storage', updateDashboard);

                // Rafraîchir auto
                setInterval(updateDashboard, 2000);

                console.log('✅ Dashboard initialisé et actif');
            });

            // ========================================
            // FONCTIONS TEST GLOBALES
            // ========================================
            window.testAddXP = function() {
                window.xpSystem.addXP('francais', 50, { test: true });
                alert('✅ +50 XP ajoutés au français !');
            };

            window.showAllData = function() {
                const stats = window.xpSystem.getStats();
                alert(JSON.stringify(stats, null, 2));
                console.log('📊 Stats complètes:', stats);
            };

            window.resetAllXP = function() {
                if (confirm('⚠️ SUPPRIMER TOUS LES XP ?')) {
                    window.xpSystem.reset();
                    location.reload();
                }
            };

        })();
    </script>
</body>
</html>
