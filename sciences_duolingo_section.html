{

</script>
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Sciences CM2 | Le Monde des Curieux">
    <meta property="og:description" content="98 questions de Sciences CM2 : Terre, Vivant, Technologie. Leçons et quiz gamifiés. 100% gratuit.">
    <meta property="og:url" content="https://lemondedescurieux.fr/sciences_duolingo_section.html">
    <meta property="og:image" content="https://lemondedescurieux.fr/images/og-preview.webp">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Le Monde des Curieux — Sciences CM2 avec Curio le renard">
    <meta property="og:locale" content="fr_FR">
    <meta property="og:site_name" content="Le Monde des Curieux">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Sciences CM2 | Le Monde des Curieux">
    <meta name="twitter:description" content="98 questions de Sciences CM2 : Terre, Vivant, Technologie. Leçons et quiz gamifiés. 100% gratuit.">
    <meta name="twitter:image" content="https://lemondedescurieux.fr/images/og-preview.webp">
    <meta name="twitter:image:alt" content="Le Monde des Curieux — Sciences CM2 avec Curio le renard">
    <!-- /SEO -->
        <link rel="stylesheet" href="styles/sciences_alpine.css">
        <link rel="stylesheet" href="styles/wcag-accessibility.css">
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Le Monde des Curieux">
    <link rel="apple-touch-icon" href="images/favicon.svg">
</head>

    <body x-data="sciencesApp" x-cloak>
    <a class="skip-link" href="#main-content">Aller au contenu principal</a>

        <!-- Système XP -->
        <script src="scripts/section-xp-system.js"></script>

        <!-- Bulle Curio -->
        <div x-data="curioBubble" x-show="visible" x-transition :class="'curio-bubble ' + variant">
            <button @click="hide()" class="curio-close" aria-label="Fermer">×</button>
            <div class="curio-avatar">🦊</div>
            <p class="curio-message" x-text="currentMessage"></p>
        </div>

        <main class="sciences-container" id="main-content">
            <!-- Header avec bouton retour -->
            <div class="section-header">
                <!-- FIX NAV : window.location.href à la place de history.back() -->
                <button onclick="window.location.href='index.html'" class="back-btn">
                    ← Retour à l'accueil
                </button>
            </div>

            <!-- Titre section -->
            <div class="section-title">
                <h1>🧪 Sciences</h1>
                <p>Découvre les mystères de la science et de la nature !</p>
            </div>

            <!-- Navigation domaines -->
            <div class="domains-nav" role="navigation" aria-label="Domaines scientifiques">
                <button @click="selectDomain('terre')"
                    :class="'domain-btn terre' + (currentDomain === 'terre' ? ' active' : '')" :aria-pressed="currentDomain === 'terre'">
                    🌍 Sciences de la Terre
                </button>
                <button @click="selectDomain('vivant')"
                    :class="'domain-btn vivant' + (currentDomain === 'vivant' ? ' active' : '')" :aria-pressed="currentDomain === 'vivant'">
                    🌱 Le Vivant
                </button>
                <button @click="selectDomain('matiere')"
                    :class="'domain-btn matiere' + (currentDomain === 'matiere' ? ' active' : '')" :aria-pressed="currentDomain === 'matiere'">
                    ⚗️ Matière & Énergie
                </button>
                <button @click="selectDomain('technologie')"
                    :class="'domain-btn technologie' + (currentDomain === 'technologie' ? ' active' : '')" :aria-pressed="currentDomain === 'technologie'">
                    ⚙️ Technologie
                </button>
                <button @click="selectDomain('environnement')"
                    :class="'domain-btn environnement' + (currentDomain === 'environnement' ? ' active' : '')" :aria-pressed="currentDomain === 'environnement'">
                    🌿 Développement Durable
                </button>
            </div>

            <!-- Zone d'affichage du domaine -->
            <div x-show="currentDomain" x-cloak>
                <div class="domain-content" x-transition>
                    <div class="domain-section">
                        <h2 x-text="getDomainName()"></h2>
                        <p class="domain-description" x-text="getDomainDescription()"></p>

                        <!-- Boutons actions -->
                        <div class="action-buttons">
                            <button @click="startQuiz()" class="action-btn btn-quiz" aria-label="Démarrer le quiz">
                                🎯 Lancer le Quiz
                            </button>
                            <button @click="showIllustration = true" class="action-btn btn-visual" aria-label="Voir l'illustration">
                                🖼️ Voir Illustration
                            </button>
                            <button @click="showLesson = true" class="action-btn btn-info" aria-label="En savoir plus">
                                📖 Voir la Leçon
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Zone Leçon -->
                <div x-show="showLesson" x-transition class="lesson-container">
                    <div class="lesson-header">
                        <h3>📖 <span x-text="getLessonTitle()"></span></h3>
                        <button @click="showLesson = false" class="close-btn" aria-label="Fermer">✖ Fermer</button>
                    </div>
                    <div class="lesson-content" x-html="getLessonContent()"></div>
                </div>

                <!-- Zone Illustration -->
                <div x-show="showIllustration" x-transition class="illustration-container">
                    <div class="illustration-header">
                        <h3>🖼️ <span x-text="getDomainName()"></span></h3>
                        <button @click="showIllustration = false" class="close-btn" aria-label="Fermer">✖ Fermer</button>
                    </div>
                    <img :src="getImageUrl()" alt="Illustration Sciences" class="domain-illustration"
                        @error="handleImageError($event)" loading="lazy">
                </div>

                <!-- Zone Quiz -->
                <div x-show="showQuiz && !showResults" x-transition class="quiz-container">
                    <div class="quiz-header">
                        <h3>🎯 Quiz <span x-text="getDomainName()"></span></h3>
                        <p class="quiz-progress">
                            Question <span x-text="currentQuestionIndex + 1"></span> / <span
                                x-text="getCurrentQuiz().length"></span>
                        </p>
                        <!-- FIX WCAG : ajout :aria-valuenow dynamique -->
                        <div class="progress-bar" role="progressbar"
                            :aria-valuenow="Math.round((currentQuestionIndex + 1) / getCurrentQuiz().length * 100)"
                            aria-valuemin="0" aria-valuemax="100" aria-label="Progression du quiz">
                            <div class="progress-fill"
                                :style="`width: ${((currentQuestionIndex + 1) / getCurrentQuiz().length) * 100}%`"></div>
                        </div>
                    </div>

                    <div class="quiz-content">
                        <div class="question-zone">
                            <p class="question-text" x-text="currentQuestion?.q"></p>

                            <div class="answer-options">
                                <template x-for="(option, index) in currentQuestion?.o" :key="index">
                                    <button @click="checkAnswer(option)" class="answer-btn"
                                        :style="answered && option === currentQuestion.c ? 'border-color: #4caf50; background: #e8f5e9;' :
                                                answered && option === selectedAnswer && option !== currentQuestion.c ? 'border-color: #f44336; background: #ffebee;' : ''"
                                        :disabled="answered" x-text="option">
                                    </button>
                                </template>
                            </div>

                            <div x-show="answered" x-transition class="feedback-zone" aria-live="polite" aria-atomic="true">
                                <div :class="'feedback ' + (isCorrect ? 'correct' : 'incorrect')">
                                    <span x-text="isCorrect ? '✅ Bravo ! Bonne réponse !' : '❌ Ce n\'est pas la bonne réponse.'"></span>
                                </div>
                                <div x-show="!isCorrect" class="feedback-explanation">
                                    💡 La bonne réponse était : <strong x-text="currentQuestion?.c"></strong>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Zone Résultats -->
                <div x-show="showResults" x-transition class="quiz-container">
                    <div class="results-zone" aria-live="polite">
                        <h3>🏆 Quiz Terminé !</h3>
                        <div class="score-display">
                            <div class="score-circle">
                                <span class="score-number" x-text="score"></span>
                                <span class="score-total"> / <span x-text="getCurrentQuiz().length"></span></span>
                            </div>
                            <p class="score-message" x-text="getScoreMessage()"></p>
                        </div>
                        <div class="results-actions">
                            <button @click="retryQuiz()" class="action-btn btn-quiz" aria-label="Recommencer le quiz">
                                🔄 Refaire le Quiz
                            </button>
                            <button @click="backToDomain()" class="action-btn btn-info" aria-label="Retour au domaine">
                                ← Retour au Domaine
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Données leçons -->
        <script src="scripts/data/sciences-lessons.js"></script>
        <script src="scripts/badges-system.js"></script>
        <script src="scripts/storage-bridge.js"></script>

        <!-- Alpine.js CDN -->
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

        <!-- JS inline AVANT Alpine -->
        <script>
            document.addEventListener('alpine:init', () => {
                console.log('🎯 Alpine:init déclenché');

                Alpine.data('curioBubble', () => ({
                    visible: false,
                    currentMessage: '',
                    variant: 'info',
                    autoHideTimer: null,
                    init() { window.curioBubbleInstance = this; },
                    show(m, v = 'info') {
                        if (this.autoHideTimer) clearTimeout(this.autoHideTimer);
                        this.currentMessage = m;
                        this.variant = v;
                        this.visible = true;
                        this.autoHideTimer = setTimeout(() => this.hide(), 5000);
                    },
                    hide() { this.visible = false; }
                }));

                Alpine.data('sciencesApp', () => ({
                    currentDomain: 'terre',
                    showIllustration: false,
                    showLesson: false,
                    showQuiz: false,
                    showResults: false,
                    currentQuestionIndex: 0,
                    score: 0,
                    selectedAnswer: null,
                    answered: false,
                    isCorrect: false,
                    quizFinished: false,
                    currentQuestion: null,
                    shuffledQuiz: null,
                    audioContext: null,

                    init() {
                        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        console.log('✅ sciencesApp initialisé');
                        if (window.SectionXP) window.SectionXP.init('sciences');
                        if (typeof window.sciencesLessons === 'undefined') {
                            console.error('❌ sciences-lessons.js non chargé !');
                        } else {
                            console.log('✅ sciences-lessons.js chargé');
                        }
                    },

                    playCorrectSound() {
                        try {
                            const o = this.audioContext.createOscillator(), g = this.audioContext.createGain();
                            o.connect(g); g.connect(this.audioContext.destination);
                            o.frequency.value = 523; o.type = 'sine';
                            g.gain.setValueAtTime(0.3, this.audioContext.currentTime);
                            g.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.2);
                            o.start(); o.stop(this.audioContext.currentTime + 0.2);
                        } catch (e) { }
                    },

                    playIncorrectSound() {
                        try {
                            const o = this.audioContext.createOscillator(), g = this.audioContext.createGain();
                            o.connect(g); g.connect(this.audioContext.destination);
                            o.frequency.value = 185; o.type = 'triangle';
                            g.gain.setValueAtTime(0.3, this.audioContext.currentTime);
                            g.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.3);
                            o.start(); o.stop(this.audioContext.currentTime + 0.3);
                        } catch (e) { }
                    },

                    selectDomain(domain) {
                        this.currentDomain = domain;
                        this.showIllustration = false;
                        this.showLesson = false;
                        this.showQuiz = false;
                        this.showResults = false;
                    },

                    getDomainName() {
                        if (!window.sciencesLessons) return '';
                        return window.sciencesLessons[this.currentDomain]?.name || '';
                    },

                    getDomainDescription() {
                        if (!window.sciencesLessons) return '';
                        return window.sciencesLessons[this.currentDomain]?.description || '';
                    },

                    getImageUrl() {
                        if (!window.sciencesLessons) return '';
                        return window.sciencesLessons[this.currentDomain]?.imageUrl || 'images/sciences/placeholder.jpg';
                    },

                    handleImageError(event) {
                        event.target.src = 'images/sciences/placeholder.jpg';
                    },

                    getLessonTitle() {
                        if (!window.sciencesLessons) return '';
                        const lessons = window.sciencesLessons[this.currentDomain]?.lessons;
                        if (!lessons) return '';
                        const firstTheme = Object.keys(lessons)[0];
                        return lessons[firstTheme]?.title || '';
                    },

                    getLessonContent() {
                        if (!window.sciencesLessons) return '';
                        const lessons = window.sciencesLessons[this.currentDomain]?.lessons;
                        if (!lessons) return '';
                        const firstTheme = Object.keys(lessons)[0];
                        return lessons[firstTheme]?.content || '';
                    },

                    getCurrentQuiz() {
                        // Pendant le quiz, retourne le tableau mélangé pour un ordre aléatoire cohérent
                        if (this.showQuiz && this.shuffledQuiz) return this.shuffledQuiz;
                        if (!window.sciencesLessons) return [];
                        return window.sciencesLessons[this.currentDomain]?.quiz || [];
                    },

                    canStartQuiz(domain) {
                        const cooldownKey = `quiz_cooldown_sciences_${domain}`;
                        const cooldownData = JSON.parse(localStorage.getItem(cooldownKey) || '{}');
                        if (!cooldownData.lastCompleted) return true;
                        return (Date.now() - cooldownData.lastCompleted) >= 24 * 60 * 60 * 1000;
                    },

                    getCooldownTimeRemaining(domain) {
                        const cooldownKey = `quiz_cooldown_sciences_${domain}`;
                        const cooldownData = JSON.parse(localStorage.getItem(cooldownKey) || '{}');
                        if (!cooldownData.lastCompleted) return null;
                        const remaining = (24 * 60 * 60 * 1000) - (Date.now() - cooldownData.lastCompleted);
                        if (remaining <= 0) return null;
                        return {
                            hours: Math.floor(remaining / (60 * 60 * 1000)),
                            minutes: Math.floor((remaining % (60 * 60 * 1000)) / (60 * 1000))
                        };
                    },

                    recordQuizCompletion(domain) {
                        const cooldownKey = `quiz_cooldown_sciences_${domain}`;
                        const cooldownData = {
                            lastCompleted: Date.now(),
                            count: (JSON.parse(localStorage.getItem(cooldownKey) || '{}').count || 0) + 1
                        };
                        localStorage.setItem(cooldownKey, JSON.stringify(cooldownData));
                    },

                    startQuiz() {
                        if (!this.canStartQuiz(this.currentDomain)) {
                            const remaining = this.getCooldownTimeRemaining(this.currentDomain);
                            const message = `⏰ Quiz déjà complété aujourd'hui !\n\nReviens dans ${remaining.hours}h ${remaining.minutes}min pour le refaire.`;
                            if (window.curioBubbleInstance) {
                                window.curioBubbleInstance.show(message, 'info');
                            } else {
                                alert(message);
                            }
                            return;
                        }

                        const quiz = this.getCurrentQuiz();
                        if (quiz.length === 0) {
                            if (window.curioBubbleInstance) {
                                window.curioBubbleInstance.show('Aucun quiz disponible pour ce domaine.', 'error');
                            }
                            return;
                        }

                        // Mélange aléatoire une fois pour toute la session
                        this.shuffledQuiz = [...quiz].sort(() => Math.random() - 0.5);

                        this.showQuiz = true;
                        this.showResults = false;
                        this.currentQuestionIndex = 0;
                        this.score = 0;
                        this.quizFinished = false;
                        this.loadQuestion();
                    },

                    loadQuestion() {
                        const q = this.getCurrentQuiz()[this.currentQuestionIndex];
                        const shuffled = [...q.o].sort(() => Math.random() - 0.5);
                        this.currentQuestion = { ...q, o: shuffled };
                        this.answered = false;
                        this.selectedAnswer = null;
                        this.isCorrect = false;
                    },

                    checkAnswer(answer) {
                        if (this.answered) return;
                        this.answered = true;
                        this.selectedAnswer = answer;
                        this.isCorrect = (answer === this.currentQuestion.c);
                        if (this.isCorrect) {
                            this.score++;

                            // Badge Jeune ingénieur — poser flag si question taggée
                            if (this.currentQuestion?.tags && this.currentQuestion.tags.includes('badge-ingenieur')) {
                                const countKey = 'curieux_badge_ingenieur_count';
                                const count = parseInt(localStorage.getItem(countKey) || '0') + 1;
                                localStorage.setItem(countKey, String(count));
                                if (count >= 2) {
                                    localStorage.setItem('curieux_badge_ingenieur', 'true');
                                    console.log('⚙️ Badge Jeune ingénieur débloqué !');
                                }
                            }

                            this.playCorrectSound();
                            if (window.curioBubbleInstance) window.curioBubbleInstance.show('✅ Bravo ! Continue comme ça !', 'success');
                            if (window.SectionXP) window.SectionXP.addXP('sciences', window.SectionXP.rewards.CORRECT_ANSWER);
                        } else {
                            this.playIncorrectSound();
                            if (window.curioBubbleInstance) window.curioBubbleInstance.show('Pas de panique ! Réessaye la prochaine question !', 'error');
                        }
                        setTimeout(() => { this.nextQuestion(); }, 2000);
                    },

                    nextQuestion() {
                        if (this.currentQuestionIndex < this.getCurrentQuiz().length - 1) {
                            this.currentQuestionIndex++;
                            this.loadQuestion();
                        } else {
                            this.finishQuiz();
                        }
                    },

                    finishQuiz() {
                        this.showResults = true;
                        this.quizFinished = true;
                        const quizLength = this.getCurrentQuiz().length;
                        const isPerfect = (this.score === quizLength);

                        if (window.SectionXP) {
                            window.SectionXP.addXP('sciences', window.SectionXP.rewards.QUIZ_COMPLETED);
                            if (isPerfect) {
                                window.SectionXP.addXP('sciences', window.SectionXP.rewards.PERFECT_QUIZ);
                                if (window.curioBubbleInstance) window.curioBubbleInstance.show('🏆 Quiz PARFAIT ! Tu es un champion !', 'success');
                            }
                        }

                        try {
                            const raw = localStorage.getItem('lemondedescurieux_quiz_stats');
                            const stats = raw ? JSON.parse(raw) : { totalCompleted: 0, perfectCount: 0, bySubject: {} };
                            stats.totalCompleted = (stats.totalCompleted || 0) + 1;
                            if (isPerfect) stats.perfectCount = (stats.perfectCount || 0) + 1;
                            if (!stats.bySubject) stats.bySubject = {};
                            stats.bySubject.sciences = (stats.bySubject.sciences || 0) + 1;
                            localStorage.setItem('lemondedescurieux_quiz_stats', JSON.stringify(stats));
                        } catch(e) { console.warn('[sciences] Erreur stats quiz:', e); }

                        if (window.badgeSystem) {
                            const newBadges = window.badgeSystem.checkBadges();
                            if (newBadges && newBadges.length > 0 && window.curioBubbleInstance && newBadges[0]) {
                                window.curioBubbleInstance.show('🏆 Badge débloqué : ' + newBadges[0].name + ' !', 'success');
                            }
                            if (window.BRIDGE) window.BRIDGE.syncBadges();
                        }

                        this.recordQuizCompletion(this.currentDomain);
                    },

                    retryQuiz() {
                        if (!this.canStartQuiz(this.currentDomain)) {
                            const remaining = this.getCooldownTimeRemaining(this.currentDomain);
                            const message = `⏰ Quiz déjà complété aujourd'hui !\n\nReviens dans ${remaining.hours}h ${remaining.minutes}min pour le refaire.`;
                            if (window.curioBubbleInstance) {
                                window.curioBubbleInstance.show(message, 'info');
                            } else {
                                alert(message);
                            }
                            this.backToDomain();
                            return;
                        }
                        this.showResults = false;
                        this.currentQuestionIndex = 0;
                        this.score = 0;
                        this.quizFinished = false;
                        this.loadQuestion();
                    },

                    getScoreMessage() {
                        const percentage = (this.score / this.getCurrentQuiz().length) * 100;
                        if (percentage === 100) return '🏆 Parfait ! Tu maîtrises ce domaine !';
                        if (percentage >= 80) return '🌟 Excellent ! Très bien joué !';
                        if (percentage >= 60) return '👍 Bien ! Continue comme ça !';
                        if (percentage >= 40) return '💪 Pas mal ! Révise encore un peu !';
                        return '📚 Continue à apprendre, tu vas y arriver !';
                    },

                    backToDomain() {
                        this.showResults = false;
                        this.showQuiz = false;
                    }
                }));
            });
        </script>
