<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Le Monde des Curieux</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Press Start 2P', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: white;
            border: 4px solid #000;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.3);
        }
        .header h1 {
            font-size: 20px;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .level-display {
            font-size: 24px;
            color: #f39c12;
            margin-bottom: 20px;
        }
        .xp-bar-container {
            background: #ecf0f1;
            border: 3px solid #000;
            border-radius: 10px;
            height: 30px;
            overflow: hidden;
            position: relative;
        }
        .xp-bar-fill {
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            height: 100%;
            transition: width 0.5s ease;
            width: 0%;
        }
        .xp-bar-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10px;
            color: #000;
            z-index: 1;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border: 4px solid #000;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
        }
        .stat-card .icon {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .stat-card .label {
            font-size: 8px;
            color: #7f8c8d;
            margin-bottom: 5px;
        }
        .stat-card .value {
            font-size: 18px;
            color: #2c3e50;
        }
        .sections-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .section-card {
            background: white;
            border: 3px solid #000;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }
        .section-card .emoji {
            font-size: 32px;
            margin-bottom: 8px;
        }
        .section-card .name {
            font-size: 8px;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        .section-card .xp {
            font-size: 12px;
            color: #27ae60;
        }
        .history {
            background: white;
            border: 4px solid #000;
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
        }
        .history h2 {
            font-size: 14px;
            margin-bottom: 20px;
        }
        .history-item {
            border-bottom: 2px dashed #ecf0f1;
            padding: 10px 0;
            font-size: 8px;
        }
        .history-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header">
            <h1>🎮 MON TABLEAU DE BORD</h1>
            <div class="level-display" id="level-display">Niveau 1</div>
            <div class="xp-bar-container">
                <div class="xp-bar-fill" id="xp-bar"></div>
                <div class="xp-bar-text" id="xp-text">0 / 200 XP</div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="icon">⭐</div>
                <div class="label">XP TOTAL</div>
                <div class="value" id="total-xp">0</div>
            </div>
            <div class="stat-card">
                <div class="icon">🏆</div>
                <div class="label">NIVEAU</div>
                <div class="value" id="current-level">1</div>
            </div>
            <div class="stat-card">
                <div class="icon">📚</div>
                <div class="label">LEÇONS</div>
                <div class="value" id="lessons-count">0</div>
            </div>
            <div class="stat-card">
                <div class="icon">🔥</div>
                <div class="label">SÉRIE</div>
                <div class="value" id="streak">0 jours</div>
            </div>
        </div>

        <h2 style="color: white; font-size: 16px; margin-bottom: 20px;">📊 XP PAR MATIÈRE</h2>
        <div class="sections-grid" id="sections-grid"></div>

        <div class="history">
            <h2>📜 HISTORIQUE RÉCENT</h2>
            <div id="history-list"></div>
        </div>
    </div>

    <!-- Charger système XP unifié -->
    <script src="scripts/core/xp-system-unified.js"></script>
    <script>
        // Données sections
        const sectionsData = [
            { id: 'francais', name: 'Français', emoji: '🇫🇷' },
            { id: 'anglais', name: 'Anglais', emoji: '🇬🇧' },
            { id: 'maths', name: 'Maths', emoji: '🔢' },
            { id: 'sciences', name: 'Sciences', emoji: '🔬' },
            { id: 'histoire', name: 'Histoire', emoji: '🏛️' },
            { id: 'programmation', name: 'Code', emoji: '💻' },
            { id: 'echecs', name: 'Échecs', emoji: '♟️' },
            { id: 'philosophie', name: 'Philo', emoji: '🤔' }
        ];

        function updateDashboard() {
            const xpSystem = window.xpSystem;
            
            // Header
            const progress = xpSystem.getProgress();
            document.getElementById('level-display').textContent = `Niveau ${xpSystem.getLevel()}`;
            document.getElementById('xp-bar').style.width = progress.percentage + '%';
            document.getElementById('xp-text').textContent = `${progress.current} / ${progress.target} XP`;
            
            // Stats
            document.getElementById('total-xp').textContent = xpSystem.getTotal();
            document.getElementById('current-level').textContent = xpSystem.getLevel();
            
            const history = xpSystem.getHistory();
            document.getElementById('lessons-count').textContent = history.length;
            
            // Sections
            const sectionsGrid = document.getElementById('sections-grid');
            sectionsGrid.innerHTML = '';
            const allXP = xpSystem.getAllSections();
            
            sectionsData.forEach(section => {
                const xp = allXP[section.id] || 0;
                const card = document.createElement('div');
                card.className = 'section-card';
                card.innerHTML = `
                    <div class="emoji">${section.emoji}</div>
                    <div class="name">${section.name}</div>
                    <div class="xp">${xp} XP</div>
                `;
                sectionsGrid.appendChild(card);
            });
            
            // Historique
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';
            
            if (history.length === 0) {
                historyList.innerHTML = '<div style="color: #95a5a6; font-size: 8px;">Aucune activité récente</div>';
            } else {
                history.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'history-item';
                    const date = new Date(item.timestamp).toLocaleString('fr-FR');
                    div.innerHTML = `
                        <span style="color: #27ae60;">+${item.amount} XP</span>
                        <span style="color: #7f8c8d;"> • ${item.section}</span>
                        ${item.details.lesson ? `<br><span style="color: #95a5a6;">${item.details.lesson}</span>` : ''}
                    `;
                    historyList.appendChild(div);
                });
            }
        }

        // Mise à jour au chargement
        updateDashboard();

        // Écouter les mises à jour XP
        window.addEventListener('xp:updated', updateDashboard);
        window.addEventListener('xp:levelup', (e) => {
            alert(`🎉 NIVEAU ${e.detail.level} ATTEINT !`);
            updateDashboard();
        });

        // Rafraîchir toutes les 5 secondes
        setInterval(updateDashboard, 5000);
    </script>
</body>
</html>
