<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Monde des Curieux - Accueil</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/home-page.css">
    <link rel="stylesheet" href="styles/side-menu-unified.css">
    <link rel="stylesheet" href="styles/mindmap_svg.css">
    <link rel="stylesheet" href="styles/missions-dynamic.css">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script src="scripts/mission-histoire.js"></script>
    <script src="scripts/mission-robots.js"></script>
    <script src="scripts/mission-sciences.js"></script>
    <script src="scripts/mission-francais.js"></script>
    <script src="scripts/mission-english.js"></script>
</head>
<body class="home-page">

    <header class="main-header">
        <div class="header-content">
            <div class="header-text">
                <h1>🎮 Le Monde des Curieux</h1>
                <p>Instruction en Famille & Réussite Scolaire</p>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <button class="stats-btn" onclick="window.location.href='dashboard-analytics.html'">📊 Stats</button>
                <div id="sound-toggle-btn" onclick="initAndToggleAudio()" style="cursor:pointer; font-size:20px; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 5px;">🔇</div>
            </div>
        </div>
    </header>

    <main class="game-container">
        <section class="map-section">
            <div class="mindmap-container">
                <svg viewBox="0 0 1024 1024" class="mindmap-svg">
                    <image href="images/mindmap_lemondedescurieux_v2.png" width="1024" height="1024"/>
                    <a href="francais_duolingo_section.html"><circle class="zone-clickable" cx="209" cy="270" r="85"></circle></a>
                    <a href="maths_duolingo_section.html"><circle class="zone-clickable" cx="809" cy="271" r="85"></circle></a>
                    <a href="histoire_duolingo_section.html"><circle class="zone-clickable" cx="125" cy="491" r="85"></circle></a>
                    <a href="english_duolingo_section.html"><circle class="zone-clickable" cx="900" cy="490" r="85"></circle></a>
                    <a href="sciences_duolingo_section.html"><circle class="zone-clickable" cx="182" cy="724" r="80"></circle></a>
                    <a href="ressources_youtube_integration.html"><circle class="zone-clickable" cx="843" cy="724" r="85"></circle></a>
                    <a href="informations_section.html"><circle class="zone-clickable" cx="641" cy="846" r="80"></circle></a>
                    <a href="index-dashboard.html"><circle class="zone-clickable" cx="392" cy="844" r="75"></circle></a>
                </svg>
            </div>
        </section>

        <aside class="sidebar-section">
            <div class="card">
                <h2>📊 Ma Progression</h2>
                <div style="font-size: 10px; margin-bottom: 8px;">⭐ <span id="xp-val">0</span> XP | 🎯 <span id="mission-val">0</span>/5</div>
                <div class="xp-bar-container">
                    <div id="xp-bar-fill" class="xp-bar-fill"></div>
                </div>
            </div>

            <div class="card">
                <h2>🚀 Missions</h2>
                <div class="mission-list">
                    <div class="mission-item">👑 Roi Soleil <button id="btn-roi-soleil" onclick="handleStart('roi-soleil', missionHistoire)" class="play-btn">Jouer</button></div>
                    <div class="mission-item">💧 Cycle Eau <button id="btn-cycle-eau" onclick="handleStart('cycle-eau', missionEau)" class="play-btn">Jouer</button></div>
                    <div class="mission-item">🤖 Robots <button id="btn-robots_01" onclick="handleStart('robots_01', missionRobots)" class="play-btn">Jouer</button></div>
                    <div class="mission-item">📚 Français <button id="btn-francais_01" onclick="handleStart('francais_01', missionFrancais)" class="play-btn">Jouer</button></div>
                    <div class="mission-item">🇬🇧 English <button id="btn-english_01" onclick="handleStart('english_01', missionEnglish)" class="play-btn">Jouer</button></div>
                </div>
                <button onclick="resetProgression()" class="reset-btn" style="margin-top:10px; font-size:6px;">RÉINITIALISER</button>
            </div>
        </aside>
    </main>

    <div id="quiz-overlay" class="quiz-overlay" style="display:none;">
        <div class="quiz-box" id="quiz-card">
            <div id="quiz-header"></div>
            <div id="quiz-body"></div>
            <div id="feedback" style="margin-top:15px; font-size:10px; min-height: 15px;"></div>
        </div>
    </div>

    <script>
        // --- SYSTÈME AUDIO SANS FICHIERS (Comme lesson-engine.js) ---
        let audioEnabled = false;
        let audioCtx = null;

        function initAndToggleAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            audioEnabled = !audioEnabled;
            document.getElementById('sound-toggle-btn').innerText = audioEnabled ? "🔊" : "🔇";
            if (audioEnabled) playSynthSfx('click');
        }

        function playSynthSfx(type) {
            if (!audioEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'success') {
                osc.frequency.setValueAtTime(587, now); 
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(); osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(110, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(); osc.stop(now + 0.2);
            } else if (type === 'click') {
                osc.frequency.setValueAtTime(440, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.05);
                osc.start(); osc.stop(now + 0.05);
            } else if (type === 'victory') {
                [523, 659, 783, 1046].forEach((f, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.frequency.setValueAtTime(f, now + (i * 0.1));
                    g.gain.setValueAtTime(0.1, now + (i * 0.1));
                    g.gain.exponentialRampToValueAtTime(0.01, now + (i * 0.1) + 0.4);
                    o.start(now + (i * 0.1)); o.stop(now + (i * 0.1) + 0.4);
                });
            }
        }

        // --- LOGIQUE MISSIONS ---
        let currentMission = null;
        let stepIndex = 0;

        function handleStart(id, missionData) {
            if (!audioCtx) initAndToggleAudio(); // Active le son au premier clic
            playSynthSfx('click');
            currentMission = missionData;
            stepIndex = 0;
            document.getElementById('quiz-overlay').style.display = 'flex';
            showStep();
        }

        function showStep() {
            const step = currentMission.steps[stepIndex];
            document.getElementById('quiz-header').innerHTML = `<h3 style="color:#2a9d8f; font-size:12px;">${step.subject}</h3>`;
            document.getElementById('quiz-body').innerHTML = `
                <p style="margin:20px 0; font-size:9px;">${step.question}</p>
                ${step.options.map((o, i) => `<button class="option-btn" onclick="checkAnswer(${i})">${o}</button>`).join('')}
            `;
            document.getElementById('feedback').innerText = "";
        }

        function checkAnswer(i) {
            const fb = document.getElementById('feedback');
            if (i === currentMission.steps[stepIndex].correct) {
                playSynthSfx('success');
                fb.innerText = "✔️ BIEN JOUÉ !";
                fb.style.color = "#27ae60";
                setTimeout(() => {
                    stepIndex++;
                    if (stepIndex < currentMission.steps.length) showStep();
                    else finishMission();
                }, 800);
            } else {
                playSynthSfx('wrong');
                fb.innerText = "❌ RÉESSAIE !";
                fb.style.color = "#e74c3c";
                const card = document.getElementById('quiz-card');
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 500);
            }
        }

        function finishMission() {
            document.getElementById('quiz-overlay').style.display = 'none';
            let done = JSON.parse(localStorage.getItem('curio_missions') || "[]");
            
            if (!done.includes(currentMission.id)) {
                done.push(currentMission.id);
                localStorage.setItem('curio_missions', JSON.stringify(done));
                let xp = parseInt(localStorage.getItem('curio_xp') || 0) + 50;
                localStorage.setItem('curio_xp', xp);
            }
            
            updateUI();

            // CONFETTIS ET SON VICTOIRE (Seulement si 5/5)
            if (done.length >= 5) {
                playSynthSfx('victory');
                const end = Date.now() + 3000;
                (function frame() {
                    confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0, y: 0.8 } });
                    confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1, y: 0.8 } });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
            }
        }

        function updateUI() {
            const done = JSON.parse(localStorage.getItem('curio_missions') || "[]");
            const xp = parseInt(localStorage.getItem('curio_xp') || 0);
            
            document.getElementById('xp-val').innerText = xp;
            document.getElementById('mission-val').innerText = done.length;
            
            // Barre de progression (250 XP = 100%)
            const progress = Math.min((xp / 250) * 100, 100);
            document.getElementById('xp-bar-fill').style.width = progress + "%";
            
            done.forEach(id => {
                const btn = document.getElementById(`btn-${id}`);
                if (btn) {
                    btn.innerText = "OK";
                    btn.disabled = true;
                    if (!btn.parentElement.querySelector('.mission-badge')) {
                        const badge = document.createElement('span');
                        badge.className = 'mission-badge'; badge.innerText = '⭐ ';
                        btn.parentElement.insertBefore(badge, btn);
                    }
                }
            });
        }

        function resetProgression() {
            if(confirm("Effacer ta progression ?")) { localStorage.clear(); location.reload(); }
        }

        window.onload = updateUI;
    </script>
</body>
</html>
