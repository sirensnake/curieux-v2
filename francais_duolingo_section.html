        <!-- JS inline AVANT Alpine -->
        <script>
            document.addEventListener('alpine:init', () => {
                console.log('🎯 Alpine:init déclenché');

                Alpine.data('curioBubble', () => ({
                    visible: false,
                    currentMessage: '',
                    variant: 'info',
                    autoHideTimer: null,
                    init() { window.curioBubbleInstance = this; },
                    show(m, v = 'info') {
                        if (this.autoHideTimer) clearTimeout(this.autoHideTimer);
                        this.currentMessage = m;
                        this.variant = v;
                        this.visible = true;
                        this.autoHideTimer = setTimeout(() => this.hide(), 5000);
                    },
                    hide() { this.visible = false; }
                }));

                Alpine.data('francaisApp', () => ({
                    currentTheme: 'grammaire',
                    showIllustration: false,
                    showLesson: false,
                    showQuiz: false,
                    showResults: false,
                    currentQuestionIndex: 0,
                    score: 0,
                    selectedAnswer: null,
                    answered: false,
                    isCorrect: false,
                    quizFinished: false,
                    currentQuestion: null,
                    audioContext: null,
                    shuffledQuiz: null,

                    init() {
                        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        console.log('✅ francaisApp initialisé');

                        // Initialiser le système XP
                        if (window.SectionXP) {
                            window.SectionXP.init('francais');
                        }
                    },

                    playCorrectSound() {
                        try {
                            const o = this.audioContext.createOscillator(), g = this.audioContext.createGain();
                            o.connect(g); g.connect(this.audioContext.destination);
                            o.frequency.value = 523; o.type = 'sine';
                            g.gain.setValueAtTime(0.3, this.audioContext.currentTime);
                            g.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.2);
                            o.start(); o.stop(this.audioContext.currentTime + 0.2);
                        } catch (e) { }
                    },

                    playIncorrectSound() {
                        try {
                            const o = this.audioContext.createOscillator(), g = this.audioContext.createGain();
                            o.connect(g); g.connect(this.audioContext.destination);
                            o.frequency.value = 185; o.type = 'triangle';
                            g.gain.setValueAtTime(0.3, this.audioContext.currentTime);
                            g.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.3);
                            o.start(); o.stop(this.audioContext.currentTime + 0.3);
                        } catch (e) { }
                    },

                    themes: {
                        grammaire: {
                            name: 'Grammaire',
                            description: 'Maîtrise les règles essentielles : homophones, accords, COD/COI',
                            imageUrl:'/images/francais/illustration_grammaire.webp'
                        },
                        conjugaison: {
                            name: 'Conjugaison',
                            description: 'Apprends les temps : présent, futur, imparfait, passé composé',
                            imageUrl:'/images/francais/illustration_conjugaison.webp'
                        },
                        vocabulaire: {
                            name: 'Vocabulaire',
                            description: 'Enrichis ton vocabulaire : synonymes, antonymes, expressions',
                            imageUrl:'/images/francais/illustration_vocabulaire.webp'
                        },
                        orthographe: {
                            name: 'Orthographe',
                            description: 'Maîtrise les sons complexes et les lettres muettes',
                            imageUrl:'/images/francais/illustration_orthographe.webp'
                        },
                        ponctuation: {
                            name: 'Ponctuation',
                            description: 'Apprends à utiliser les signes de ponctuation correctement',
                            imageUrl:'/images/francais/illustration_ponctuation.webp'
                        },
                        typesphrases: {
                            name: 'Types de Phrases',
                            description: 'Distingue les phrases déclaratives, interrogatives, exclamatives et impératives',
                            imageUrl:'/images/francais/illustration_phrases.webp'
                        },
                        classesmots: {
                            name: 'Classes de Mots',
                            description: 'Identifie les noms, verbes, adjectifs et déterminants',
                            imageUrl:'/images/francais/illustration_classes.webp'
                        },
                        lecture: {
                            name: 'Lecture & Compréhension',
                            description: 'Comprends un texte et trouve l\'idée principale',
                            imageUrl:'/images/francais/illustration_lecture.webp'
                        },
                        production: {
                            name: 'Production d\'Écrit',
                            description: 'Rédige des récits, descriptions et dialogues',
                            imageUrl:'/images/francais/illustration_ecriture.webp'
                        },
                        poesie: {
                            name: 'Poésie',
                            description: 'Découvre les rimes, les vers et les figures de style',
                            imageUrl:'/images/francais/illustration_poesie.webp'
                        }
                    },

                    // Contenus pédagogiques
                    lessonData: {
                        grammaire: {
                            title: "📚 La Grammaire",
                            content: `
                                <h3>Pourquoi la grammaire ?</h3>
                                <p>La grammaire, ce sont les <strong>règles de la langue</strong>. Elle t'aide à bien écrire et à te faire comprendre !</p>

                                <h3>Les homophones</h3>
                                <p>Les homophones sont des mots qui <strong>se prononcent pareil</strong> mais s'écrivent différemment :</p>
                                <ul>
                                    <li><strong>a / à</strong> : "Il <span class="correct">a</span> un chat" / "Il va <span class="correct">à</span> l'école"</li>
                                    <li><strong>et / est</strong> : "Paul <span class="correct">et</span> Marie" / "Il <span class="correct">est</span> grand"</li>
                                    <li><strong>son / sont</strong> : "<span class="correct">Son</span> vélo" / "Ils <span class="correct">sont</span> contents"</li>
                                    <li><strong>ou / où</strong> : "Pomme <span class="correct">ou</span> poire ?" / "<span class="correct">Où</span> est-il ?"</li>
                                    <li><strong>ce / se</strong> : "<span class="correct">Ce</span> livre" / "Il <span class="correct">se</span> lave"</li>
                                </ul>

                                <h3>Les accords</h3>
                                <h4>Accord en genre et nombre</h4>
                                <ul>
                                    <li><strong>Masculin/Féminin</strong> : un chat <span class="correct">noir</span> / une chatte <span class="correct">noire</span></li>
                                    <li><strong>Singulier/Pluriel</strong> : un livre <span class="correct">intéressant</span> / des livres <span class="correct">intéressants</span></li>
                                </ul>

                                <h4>Accord du participe passé</h4>
                                <ul>
                                    <li>Avec <strong>être</strong> : "Elle est <span class="correct">partie</span>" (accord avec le sujet)</li>
                                    <li>Avec <strong>avoir</strong> : "Il a <span class="correct">mangé</span>" (pas d'accord) MAIS "La pomme qu'il a <span class="correct">mangée</span>" (accord avec le COD placé avant)</li>
                                </ul>

                                <h3>COD et COI</h3>
                                <h4>Le COD (Complément d'Objet Direct)</h4>
                                <p>Il répond à la question <strong>"quoi ?" ou "qui ?"</strong> :</p>
                                <div class="example">
                                    "Je mange <strong>une pomme</strong>" → Je mange quoi ? Une pomme (COD)
                                </div>

                                <h4>Le COI (Complément d'Objet Indirect)</h4>
                                <p>Il répond à la question <strong>"à qui ?", "à quoi ?", "de qui ?", "de quoi ?"</strong> :</p>
                                <div class="example">
                                    "Je parle <strong>à Marie</strong>" → Je parle à qui ? À Marie (COI)
                                </div>

                                <h3>Les pluriels</h3>
                                <ul>
                                    <li>Règle générale : <strong>+ s</strong> → chat → chats</li>
                                    <li>Mots en <strong>-eu, -au, -eau</strong> : + x → jeu → jeux, château → châteaux</li>
                                    <li>Mots en <strong>-al</strong> : → -aux → cheval → chevaux</li>
                                    <li>Mots en <strong>-ou</strong> : + s SAUF 7 exceptions (bijou, caillou, chou, genou, hibou, joujou, pou) → + x</li>
                                    <li>Mots en <strong>-s, -x, -z</strong> : ne changent pas → souris → souris</li>
                                </ul>

                                <h3 class="retenir">📌 À retenir</h3>
                                <p>📌 Relis toujours tes phrases pour vérifier les accords !</p>
                                <p>📌 Pour les homophones, demande-toi quel est le sens de la phrase 🤔</p>
                            `
                        },
                        conjugaison: {
                            title: "🔄 La Conjugaison",
                            content: `
                                <h3>Pourquoi conjuguer ?</h3>
                                <p>La conjugaison permet de situer une action dans le <strong>temps</strong> (passé, présent, futur) et d'indiquer <strong>qui</strong> fait l'action !</p>

                                <h3>Le Présent</h3>
                                <p>Le présent exprime une action qui <strong>se passe maintenant</strong> ou une vérité générale.</p>

                                <h4>Verbes du 1er groupe (-er)</h4>
                                <p>Exemple : <strong>CHANTER</strong></p>
                                <ul>
                                    <li>Je chant<strong>e</strong></li>
                                    <li>Tu chant<strong>es</strong></li>
                                    <li>Il/Elle chant<strong>e</strong></li>
                                    <li>Nous chant<strong>ons</strong></li>
                                    <li>Vous chant<strong>ez</strong></li>
                                    <li>Ils/Elles chant<strong>ent</strong></li>
                                </ul>

                                <h4>Verbes du 2ème groupe (-ir)</h4>
                                <p>Exemple : <strong>FINIR</strong></p>
                                <ul>
                                    <li>Je fin<strong>is</strong></li>
                                    <li>Tu fin<strong>is</strong></li>
                                    <li>Il/Elle fin<strong>it</strong></li>
                                    <li>Nous fin<strong>issons</strong></li>
                                    <li>Vous fin<strong>issez</strong></li>
                                    <li>Ils/Elles fin<strong>issent</strong></li>
                                </ul>

                                <h4>Verbes fréquents du 3ème groupe</h4>
                                <ul>
                                    <li><strong>ÊTRE</strong> : je suis, tu es, il est, nous sommes, vous êtes, ils sont</li>
                                    <li><strong>AVOIR</strong> : j'ai, tu as, il a, nous avons, vous avez, ils ont</li>
                                    <li><strong>ALLER</strong> : je vais, tu vas, il va, nous allons, vous allez, ils vont</li>
                                    <li><strong>FAIRE</strong> : je fais, tu fais, il fait, nous faisons, vous faites, ils font</li>
                                </ul>

                                <h3>Le Futur Simple</h3>
                                <p>Le futur exprime une action qui <strong>se passera plus tard</strong>.</p>
                                <p>Formation : <strong>infinitif + terminaisons</strong> (-ai, -as, -a, -ons, -ez, -ont)</p>

                                <div class="example">
                                    <strong>CHANTER</strong> : je chanter<strong>ai</strong>, tu chanter<strong>as</strong>, il chanter<strong>a</strong>, nous chanter<strong>ons</strong>, vous chanter<strong>ez</strong>, ils chanter<strong>ont</strong>
                                </div>

                                <h4>Verbes irréguliers au futur</h4>
                                <ul>
                                    <li><strong>ÊTRE</strong> → je ser<strong>ai</strong></li>
                                    <li><strong>AVOIR</strong> → j'aur<strong>ai</strong></li>
                                    <li><strong>ALLER</strong> → j'ir<strong>ai</strong></li>
                                    <li><strong>FAIRE</strong> → je fer<strong>ai</strong></li>
                                    <li><strong>VOIR</strong> → je verr<strong>ai</strong></li>
                                </ul>

                                <h3>L'Imparfait</h3>
                                <p>L'imparfait exprime une action <strong>du passé qui durait</strong> ou une habitude.</p>

                                <h3>À quoi sert la ponctuation ?</h3>
                                <p>La ponctuation donne du <strong>rythme</strong> à notre écriture, indique les <strong>pauses</strong> et le <strong>ton</strong> des phrases. Sans elle, les textes seraient impossibles à comprendre !</p>

                                <ul>

                                <ul>
                                    <li><strong>Situation initiale</strong> : Présente les personnages, le lieu, le moment → <em>Il était une fois...</em></li>
                                    <li><strong>Élément déclencheur</strong> : Un problème survient, quelque chose change</li>
                                    <li><strong>Péripéties</strong> : Les aventures, les obstacles à surmonter</li>
                                    <li><strong>Résolution</strong> : Le problème se résout</li>
                                    <li><strong>Situation finale</strong> : La nouvelle situation, la morale éventuelle</li>
                                </ul>

                                <ul>
                                    <li><strong>Portrait physique</strong> : taille, couleur des yeux/cheveux, vêtements</li>

                                    <li><strong>Paroles</strong> : le dialogue montre le caractère</li>

                                <ul>
                                    <li><strong>Imparfait</strong> : descriptions, actions de fond, habitudes → <em>La maison était vieille...</em></li>

                                    <li><strong>Passé composé</strong> : actions principales (courant) → <em>Il a couru vers la porte.</em></li>
                                    <li><strong>Présent</strong> : récit vivant → <em>Il court vers la porte.</em></li>
                                </ul>

                                <p>La poésie est un art qui <strong>joue avec les sons, les rythmes et les images</strong> pour exprimer des émotions et des sensations. Un poème, c'est de la musique avec des mots !</p>

                                <h3>La structure du poème</h3>
                                <ul>

                                        </ul>
                                    </li>
                                </ul>

                                <h3>Les rimes</h3>
                                <p>Les rimes, ce sont les <strong>sons identiques à la fin des vers</strong> :</p>
                                <ul>
                                    <li><strong>Rimes suivies (AABB)</strong> : 1er et 2e riment, 3e et 4e riment</li>
                                    <li><strong>Rimes croisées (ABAB)</strong> : 1er et 3e riment, 2e et 4e riment</li>
                                    <li><strong>Rimes embrassées (ABBA)</strong> : 1er et 4e riment, 2e et 3e riment</li>
                                </ul>

                                <h3>Le rythme — les syllabes</h3>
                                <p>On compte les <strong>syllabes</strong> dans chaque vers pour créer un rythme régulier :</p>

                                    <li><strong>Décasyllabe</strong> : 10 syllabes</li>

                                <h3>Les figures de style</h3>
                                <h4>La comparaison</h4>
                                <p>Rapproche deux éléments avec un mot comparatif (<strong>comme, tel, pareil à, semblable à</strong>)</p>
                                <div class="example">Il est <strong>fort comme</strong> un lion. / Elle court <strong>telle</strong> le vent.</div>

                                <h4>La métaphore</h4>
                                <p>Compare deux éléments SANS mot comparatif : on dit qu'une chose EN EST une autre.</p>
                                <div class="example">Cet homme <strong>est un lion</strong>. / La vie <strong>est un long fleuve</strong>.</div>

                    selectTheme(t) {
                        this.currentTheme = t;
                        this.showQuiz = this.showResults = this.showIllustration = this.showLesson = false;
                    },

                    getThemeName() {
                        return this.themes[this.currentTheme]?.name || '';
                    },

                    getThemeDescription() {
                        return this.themes[this.currentTheme]?.description || '';
                    },

                    getImageUrl() {
                        return this.themes[this.currentTheme]?.imageUrl || '';
                    },

                    getLessonTitle() {
                        return this.lessonData[this.currentTheme]?.title || '';
                    },

                    getLessonContent() {
                        return this.lessonData[this.currentTheme]?.content || '';
                    },

                    toggleIllustration() {
                        this.showIllustration = !this.showIllustration;
                    },

                    canStartQuiz(theme) {
                        const cooldownKey = `quiz_cooldown_francais_${theme}`;
                        const cooldownData = JSON.parse(localStorage.getItem(cooldownKey) || '{}');
                        if (!cooldownData.lastCompleted) return true;
                        const now = Date.now();
                        const timeSinceCompletion = now - cooldownData.lastCompleted;
                        const cooldownDuration = 24 * 60 * 60 * 1000;
                        return timeSinceCompletion >= cooldownDuration;
                    },

                    getCooldownTimeRemaining(theme) {
                        const cooldownKey = `quiz_cooldown_francais_${theme}`;
                        const cooldownData = JSON.parse(localStorage.getItem(cooldownKey) || '{}');
                        if (!cooldownData.lastCompleted) return null;
                        const now = Date.now();
                        const timeSinceCompletion = now - cooldownData.lastCompleted;
                        const cooldownDuration = 24 * 60 * 60 * 1000;
                        const remaining = cooldownDuration - timeSinceCompletion;
                        if (remaining <= 0) return null;
                        const hours = Math.floor(remaining / (60 * 60 * 1000));
                        const minutes = Math.floor((remaining % (60 * 60 * 1000)) / (60 * 1000));
                        return { hours, minutes };
                    },

                    recordQuizCompletion(theme) {
                        const cooldownKey = `quiz_cooldown_francais_${theme}`;
                        const cooldownData = {
                            lastCompleted: Date.now(),
                            count: (JSON.parse(localStorage.getItem(cooldownKey) || '{}').count || 0) + 1
                        };
                        localStorage.setItem(cooldownKey, JSON.stringify(cooldownData));
                        console.log(`🔒 Cooldown activé pour ${theme}`);
                    },

                    startQuiz() {
                        if (!this.canStartQuiz(this.currentTheme)) {
                            const remaining = this.getCooldownTimeRemaining(this.currentTheme);
                            const message = `⏰ Quiz déjà complété aujourd'hui !\n\nReviens dans ${remaining.hours}h ${remaining.minutes}min pour le refaire.`;
                            if (window.curioBubbleInstance) {
                                window.curioBubbleInstance.show(message, 'info');
                            } else {
                                alert(message);
                            }
                            return;
                        }

                        this.currentQuestionIndex = 0;
                        this.score = 0;
                        this.answered = false;
                        this.quizFinished = false;

                        // Mélange aléatoire : ordre des questions ET options de chaque question
                        const quiz = this.quizQuestions[this.currentTheme] || [];
                        const shuffledOrder = [...quiz].sort(() => Math.random() - 0.5);
                        this.shuffledQuiz = shuffledOrder.map(q => ({
                            ...q,
                            options: this.shuffleArray([...q.options])
                        }));

                        this.currentQuestion = this.shuffledQuiz[0];
                        this.showQuiz = true;
                        this.showLesson = false;
                        this.showIllustration = false;
                    },

                    shuffleArray(array) {
                        const shuffled = [...array];
                        for (let i = shuffled.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                        }
                        return shuffled;
                    },

                    getCurrentQuiz() {
                        // Pendant le quiz, retourne le tableau mélangé pour un ordre cohérent
                        if (this.showQuiz && this.shuffledQuiz) return this.shuffledQuiz;
                        return this.quizQuestions[this.currentTheme] || [];
                    },

                    loadQuestion() {
                        const questions = this.getCurrentQuiz();
                        this.currentQuestion = questions[this.currentQuestionIndex];
                        this.answered = false;
                        this.isCorrect = false;
                    },

                    checkAnswer(selectedOption) {
                        if (this.answered) return;
                        this.answered = true;
                        this.isCorrect = (selectedOption === this.currentQuestion.correct);
                        if (this.isCorrect) {
                            this.score++;
                            this.playCorrectSound();
                            if (window.SectionXP) {
                                window.SectionXP.addXP('francais', window.SectionXP.rewards.QUESTION_CORRECT);
                            }
                        } else {
                            this.playIncorrectSound();
                        }
                        setTimeout(() => { this.nextQuestion(); }, 2000);
                    },

                    nextQuestion() {
                        if (this.currentQuestionIndex < this.getCurrentQuiz().length - 1) {
                            this.currentQuestionIndex++;
                            this.loadQuestion();
                        } else {
                            this.finishQuiz();
                        }
                    },

                    finishQuiz() {
                        this.quizFinished = true;
                        const quizLength = this.getCurrentQuiz().length;
                        const isPerfect = (this.score === quizLength);

                        if (window.SectionXP) {
                            window.SectionXP.addXP('francais', window.SectionXP.rewards.QUIZ_COMPLETED);
                            if (isPerfect) {
                                window.SectionXP.addXP('francais', window.SectionXP.rewards.PERFECT_QUIZ);
                            }
                        }

                        try {
                            const raw = localStorage.getItem('lemondedescurieux_quiz_stats');
                            const stats = raw ? JSON.parse(raw) : {
                                totalCompleted: 0,
                                perfectCount: 0,
                                bySubject: { francais: 0, anglais: 0, maths: 0, sciences: 0, histoire: 0 }
                            };
                            stats.totalCompleted = (stats.totalCompleted || 0) + 1;
                            if (isPerfect) stats.perfectCount = (stats.perfectCount || 0) + 1;
                            if (!stats.bySubject) stats.bySubject = {};
                            stats.bySubject.francais = (stats.bySubject.francais || 0) + 1;
                            localStorage.setItem('lemondedescurieux_quiz_stats', JSON.stringify(stats));
                        } catch(e) {
                            console.warn('[francais] Erreur stats quiz:', e);
                        }

                        this.recordQuizCompletion(this.currentTheme);

                        if (window.badgeSystem) {
                            const newBadges = window.badgeSystem.checkBadges();
                            if (newBadges.length > 0 && window.curioBubbleInstance && newBadges[0]) {
                                window.curioBubbleInstance.show('🏆 Badge débloqué : ' + newBadges[0].name + ' !', 'success');
                            }
                            if (window.BRIDGE) window.BRIDGE.syncBadges();
                        }
                    },

                    retryQuiz() {
                        if (!this.canStartQuiz(this.currentTheme)) {
                            const remaining = this.getCooldownTimeRemaining(this.currentTheme);
                            const message = `⏰ Quiz déjà complété aujourd'hui !\n\nReviens dans ${remaining.hours}h ${remaining.minutes}min pour le refaire.`;
                            if (window.curioBubbleInstance) {
                                window.curioBubbleInstance.show(message, 'info');
                            } else {
                                alert(message);
                            }
                            this.backToTheme();
                            return;
                        }
                        // Re-mélange pour un nouvel ordre à chaque retry
                        const quiz = this.quizQuestions[this.currentTheme] || [];
                        const shuffledOrder = [...quiz].sort(() => Math.random() - 0.5);
                        this.shuffledQuiz = shuffledOrder.map(q => ({
                            ...q,
                            options: this.shuffleArray([...q.options])
                        }));
                        this.quizFinished = false;
                        this.currentQuestionIndex = this.score = 0;
                        this.loadQuestion();
                    },

                    getScoreMessage() {
                        const percentage = (this.score / this.getCurrentQuiz().length) * 100;
                        if (percentage === 100) return '🏆 Parfait ! Tu maîtrises ce thème !';
                        if (percentage >= 80) return '🌟 Excellent ! Très bien joué !';
                        if (percentage >= 60) return '👍 Bien ! Continue comme ça !';
                        if (percentage >= 40) return '💪 Pas mal ! Révise encore un peu !';
                        return '📚 Continue à apprendre, tu vas y arriver !';
                    },

                    backToTheme() {
                        this.showResults = false;
                        this.showQuiz = false;
                    }
                }));
            });
        </script>
